<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红果短剧下载器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #e94560; margin: 20px 0; font-size: 28px; }
h3 { color: #e94560; margin-bottom: 10px; }
.card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
input, button { padding: 12px 16px; border: none; border-radius: 8px; font-size: 14px; }
input { background: #16213e; color: #fff; flex: 1; outline: none; }
button { background: #e94560; color: #fff; cursor: pointer; font-weight: 600; }
button:hover { opacity: 0.85; }
button.secondary { background: #0f3460; }
button.danger { background: #c0392b; padding: 6px 12px; font-size: 12px; }
button.small { padding: 6px 12px; font-size: 12px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px; }
.ep { background: #16213e; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; border: 2px solid transparent; font-size: 13px; }
.ep.selected { border-color: #e94560; background: #1a1a3e; }
.info { display: flex; align-items: center; gap: 16px; }
.cover { width: 120px; border-radius: 8px; }
.ep-title { font-size: 18px; font-weight: 700; }
.ep-meta { color: #888; font-size: 13px; margin-top: 4px; }
.hidden { display: none; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.error { color: #ff6b6b; padding: 6px 10px; background: #2a1a1a; border-radius: 6px; margin: 4px 0; font-size: 12px; }
.drama-item { padding: 12px; border-bottom: 1px solid #333; }
.drama-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
.drama-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.drama-cover { width: 48px; height: 64px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #16213e; }
.drama-text { min-width: 0; flex: 1; }
.drama-name { font-weight: 700; }
.drama-meta { color: #888; font-size: 12px; margin-top: 2px; }
.drama-actions { display: flex; gap: 8px; flex-shrink: 0; }
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
.file-chip { background: #16213e; padding: 6px 10px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.file-chip button { padding: 2px 6px; font-size: 11px; }

/* 缺集展开 */
.missing-toggle { color: #ff9f43; cursor: pointer; text-decoration: underline; }
.missing-detail { margin: 8px 0; padding: 10px; background: #16213e; border-radius: 8px; font-size: 12px; color: #ccc; line-height: 1.8; max-height: 200px; overflow-y: auto; }

/* 进度面板 */
.task-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a4a; }
.task-row:last-child { border-bottom: none; }
.task-summary { flex: 1; min-width: 0; }
.task-name { font-weight: 600; font-size: 14px; }
.task-detail { color: #888; font-size: 12px; margin-top: 2px; }
.task-bar { background: #16213e; border-radius: 4px; height: 6px; margin-top: 6px; overflow: hidden; }
.task-bar-fill { background: linear-gradient(90deg, #e94560, #ff6b9d); height: 100%; transition: width 0.3s; }
.task-status { font-size: 12px; margin-left: 10px; flex-shrink: 0; }
.task-status.running { color: #2ecc71; }
.task-status.done { color: #2ecc71; }
.task-status.error { color: #ff6b6b; }

/* 登录遮罩 */
#loginOverlay { position: fixed; inset: 0; background: rgba(15,15,26,0.97); display: flex; align-items: center; justify-content: center; z-index: 999; }
#loginOverlay .login-box { background: #1a1a2e; padding: 40px; border-radius: 16px; text-align: center; width: 320px; }
#loginOverlay h2 { color: #e94560; margin-bottom: 20px; }
#loginOverlay input { width: 100%; margin-bottom: 12px; }
#loginOverlay button { width: 100%; }
#loginError { color: #ff6b6b; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>🔒 请输入密码</h2>
    <input type="password" id="loginPwd" placeholder="访问密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登录</button>
    <div id="loginError"></div>
  </div>
</div>

<div class="container">
<h1>🎬 红果短剧下载器</h1>

<div class="card">
  <div class="row">
    <input id="urlInput" placeholder="粘贴分享链接">
    <button onclick="parseDrama()">解析</button>
  </div>
</div>

<div id="infoCard" class="card hidden">
  <div class="info">
    <img id="cover" class="cover" src="">
    <div>
      <div class="ep-title" id="dramaTitle"></div>
      <div class="ep-meta" id="dramaMeta"></div>
    </div>
  </div>
  <div class="btn-group">
    <button class="secondary small" onclick="selectAll(true)">全选</button>
    <button class="secondary small" onclick="selectAll(false)">全不选</button>
    <button class="secondary small" onclick="selectRange(1,10)">前10集</button>
    <button class="secondary small" onclick="selectRange(-30,-1)">后30集</button>
  </div>
  <div class="ep-grid" id="epGrid"></div>
  <div class="row" style="margin-top:16px">
    <button onclick="startDownload()">开始下载选中集数</button>
  </div>
</div>

<div id="progressCard" class="card hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleTaskPanel()">
    <h3 style="margin:0">📊 下载任务</h3>
    <span id="taskToggle" style="color:#888;font-size:14px">▶</span>
  </div>
  <div id="taskBody" class="hidden"></div>
</div>

<div class="card">
  <h3>已下载文件</h3>
  <div id="fileList"></div>
</div>
</div>

<script>
let episodes = [];
let currentSeriesId = '';
let selectedEps = new Set();
let pollTimer = null;
let authToken = localStorage.getItem('authToken') || '';
let runningTaskId = null;

async function apiFetch(url, options = {}) {
  options.headers = options.headers || {};
  options.headers['X-Auth-Token'] = authToken;
  const r = await fetch(url, options);
  if (r.status === 401) {
    document.getElementById('loginOverlay').style.display = 'flex';
    throw new Error('未授权');
  }
  return r;
}

async function checkConfig() {
  const r = await fetch('/api/config');
  const d = await r.json();
  if (!d.need_auth) {
    document.getElementById('loginOverlay').style.display = 'none';
    init();
  } else {
    if (authToken) {
      try {
        await apiFetch('/api/files');
        document.getElementById('loginOverlay').style.display = 'none';
        init();
      } catch(e) {
        authToken = '';
        localStorage.removeItem('authToken');
      }
    }
  }
}

async function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password: pwd})});
  const d = await r.json();
  if (d.code === 0) {
    authToken = pwd;
    localStorage.setItem('authToken', pwd);
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('loginError').textContent = '';
    init();
  } else {
    document.getElementById('loginError').textContent = d.msg || '密码错误';
  }
}

function init() {
  loadFiles();
  loadTasks();
}

async function parseDrama() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  try {
    const r = await apiFetch('/api/parse', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
    const d = await r.json();
    if (d.code !== 0) { alert('解析失败: ' + d.msg); return; }
    const info = d.data;
    episodes = info.episodes;
    currentSeriesId = info.series_id;
    selectedEps = new Set(episodes.map(e => e.vid_index));
    document.getElementById('dramaTitle').textContent = info.series_title;
    document.getElementById('dramaMeta').textContent = `共 ${episodes.length} 集`;
    if (info.cover) document.getElementById('cover').src = info.cover;
    renderEpGrid();
    document.getElementById('infoCard').classList.remove('hidden');
  } catch(e) { alert('错误: ' + e.message); }
}

function renderEpGrid() {
  const grid = document.getElementById('epGrid');
  grid.innerHTML = '';
  episodes.forEach(ep => {
    const div = document.createElement('div');
    div.className = 'ep' + (selectedEps.has(ep.vid_index) ? ' selected' : '');
    div.textContent = ep.vid_index;
    div.onclick = () => { if (selectedEps.has(ep.vid_index)) selectedEps.delete(ep.vid_index); else selectedEps.add(ep.vid_index); renderEpGrid(); };
    grid.appendChild(div);
  });
}

function selectAll(sel) { selectedEps = sel ? new Set(episodes.map(e => e.vid_index)) : new Set(); renderEpGrid(); }
function selectRange(a, b) {
  const n = episodes.length;
  const start = a > 0 ? a - 1 : n + a;
  const end = b > 0 ? b : n + b;
  for (let i = start; i <= end; i++) selectedEps.add(i + 1);
  renderEpGrid();
}

async function startDownload() {
  if (!currentSeriesId) { alert('请先解析剧集'); return; }
  const eps = Array.from(selectedEps);
  if (eps.length === 0) { alert('请先选择要下载的集数'); return; }
  const resp = await apiFetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({series_id: currentSeriesId, episodes: eps})});
  const j = await resp.json();
  if (j.code !== 0) { alert('下载启动失败: ' + j.msg); return; }
  runningTaskId = j.task_id;
  document.getElementById('progressCard').classList.remove('hidden');
  startPoll();
}

function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    loadTasks();
  }, 2000);
}

async function loadTasks() {
  try {
    const r = await apiFetch('/api/tasks');
    const d = await r.json();
    if (d.code !== 0) return;
    const tasks = d.data;
    const card = document.getElementById('progressCard');
    const body = document.getElementById('taskBody');

    if (tasks.length === 0) {
      card.classList.add('hidden');
      return;
    }
    card.classList.remove('hidden');

    body.innerHTML = tasks.map(t => {
      const pct = t.total > 0 ? Math.round(t.done / t.total * 100) : 0;
      const statusText = t.status === 'running' ? '下载中' : (t.status === 'done' ? '已完成' : '失败');
      const title = t.title || (t.series_id ? '任务 ' + t.task_id : '任务');
      const errHtml = (t.errors && t.errors.length)
        ? `<div style="margin-top:6px">${t.errors.slice(0,5).map(e => '<div class="error">❌ ' + e + '</div>').join('')}${t.errors.length > 5 ? `<div style="color:#888;font-size:11px;margin-top:4px">还有 ${t.errors.length - 5} 个错误...</div>` : ''}</div>`
        : '';
      return `<div class="task-row">
        <div class="task-summary">
          <div class="task-name">${title}</div>
          <div class="task-detail">${t.done}/${t.total} · ${t.current || ''} ${t.started_at || ''}</div>
          <div class="task-bar"><div class="task-bar-fill" style="width:${pct}%"></div></div>
          ${errHtml}
        </div>
        <div class="task-status ${t.status}">${statusText}</div>
      </div>`;
    }).join('');

    // 如果有完成的任务，刷新文件列表
    if (tasks.some(t => t.status === 'done' || t.status === 'error')) {
      loadFiles();
    }
  } catch(e) {}
}

function toggleTaskPanel() {
  const body = document.getElementById('taskBody');
  const toggle = document.getElementById('taskToggle');
  if (body.classList.contains('hidden')) {
    body.classList.remove('hidden');
    toggle.textContent = '▼';
  } else {
    body.classList.add('hidden');
    toggle.textContent = '▶';
  }
}

async function deleteDrama(name) {
  if (!confirm(`确定删除《${name}》全部文件？`)) return;
  await apiFetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama: name})});
  loadFiles();
}

async function deleteFile(drama, filename) {
  if (!confirm(`删除 ${filename}？`)) return;
  await apiFetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama, filename})});
  loadFiles();
}

let mergePollTimers = {};

async function mergeDrama(name) {
  if (!confirm(`合并《${name}》所有集数为一个视频？合并后会自动删除单集文件。`)) return;
  const r = await apiFetch('/api/merge', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama: name})});
  const d = await r.json();
  if (d.code !== 0) { alert('合并失败: ' + d.msg); return; }
  // 展开合并日志
  const logEl = document.getElementById('mergelog_' + name);
  if (logEl) {
    logEl.classList.remove('hidden');
    logEl.innerHTML = '<div style="color:#888">正在合并...</div>';
  }
  pollMergeStatus(name);
}

function pollMergeStatus(name) {
  if (mergePollTimers[name]) clearInterval(mergePollTimers[name]);
  mergePollTimers[name] = setInterval(async () => {
    try {
      const r = await apiFetch('/api/merge_status/' + encodeURIComponent(name));
      const d = await r.json();
      if (d.code !== 0) return;
      const t = d.data;
      const logEl = document.getElementById('mergelog_' + name);
      if (!logEl) { clearInterval(mergePollTimers[name]); return; }
      if (t.status === 'none') {
        clearInterval(mergePollTimers[name]);
        return;
      }
      const logText = (t.logs || []).slice(-20).join('\n');
      const statusBadge = t.status === 'running' ? '<span style="color:#2ecc71">合并中...</span>' :
                          t.status === 'done' ? '<span style="color:#2ecc71">✅ 合并完成</span>' :
                          '<span style="color:#ff6b6b">❌ 失败</span>';
      logEl.innerHTML = `<div style="margin-bottom:4px">${statusBadge}</div><pre style="white-space:pre-wrap;font-size:11px;color:#aaa;max-height:150px;overflow-y:auto;margin:0">${logText}</pre>`;
      if (t.status === 'done' || t.status === 'error') {
        clearInterval(mergePollTimers[name]);
        setTimeout(() => loadFiles(), 1000);
      }
    } catch(e) {}
  }, 1500);
}

function toggleMergeLog(name) {
  const el = document.getElementById('mergelog_' + name);
  if (el) el.classList.toggle('hidden');
}

function toggleMissing(name) {
  const el = document.getElementById('missing_' + name);
  if (el.classList.contains('hidden')) {
    const list = window._missingData[name] || [];
    if (list.length > 0) {
      // 智能分组连续区间
      let ranges = [];
      let start = list[0], prev = list[0];
      for (let i = 1; i < list.length; i++) {
        if (list[i] === prev + 1) {
          prev = list[i];
        } else {
          ranges.push(start === prev ? start + '' : start + '-' + prev);
          start = prev = list[i];
        }
      }
      ranges.push(start === prev ? start + '' : start + '-' + prev);
      el.innerHTML = `<div style="color:#ff9f43;margin-bottom:4px">缺 ${list.length} 集：</div><div style="color:#ccc">${ranges.join('、')}</div>`;
    }
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

async function loadFiles() {
  try {
    const r = await apiFetch('/api/files');
    const d = await r.json();
    const el = document.getElementById('fileList');
    if (d.data.length === 0) { el.innerHTML = '<div style="color:#666">暂无下载</div>'; return; }
    el.innerHTML = d.data.map(drama => {
      let statusHtml = '';
      if (drama.merged) {
        statusHtml = ' · <span style="color:#2ecc71">✓ 已合并为全集</span>';
      } else if (drama.missing > 0) {
        statusHtml = ` · <span class="missing-toggle" onclick="toggleMissing('${drama.name}')">缺${drama.missing}集 ▾</span>`;
      } else if (drama.total_episodes && drama.count >= drama.total_episodes) {
        statusHtml = ' · <span style="color:#2ecc71">✓ 已下完</span>';
      }
      const mergeBtn = drama.merged ? '' : `<button class="small secondary" onclick="mergeDrama('${drama.name}')">合并全集</button>`;
      return `<div class="drama-item">
        <div class="drama-header">
          <div class="drama-info">
            ${drama.cover ? `<img class="drama-cover" src="${drama.cover}" loading="lazy">` : ''}
            <div class="drama-text">
              <div class="drama-name">📁 ${drama.title || drama.name}</div>
              <div class="drama-meta">${drama.count}集 · ${drama.size_mb}MB${drama.total_episodes ? ` · 共${drama.total_episodes}集` : ''}${statusHtml}</div>
            </div>
          </div>
          <div class="drama-actions">
            ${mergeBtn}
            <button class="small danger" onclick="deleteDrama('${drama.name}')">删除</button>
          </div>
        </div>
        <div id="missing_${drama.name}" class="hidden missing-detail"></div>
        <div id="mergelog_${drama.name}" class="hidden" style="margin:8px 0;padding:10px;background:#16213e;border-radius:8px"></div>
        <div class="file-grid">
          ${drama.files.map(f => `<div class="file-chip"><span>${f}</span><button onclick="deleteFile('${drama.name}','${f}')">✕</button></div>`).join('')}
        </div>
      </div>`;
    }).join('');
    window._missingData = {};
    d.data.forEach(d => { window._missingData[d.name] = d.missing_list || []; });
  } catch(e) {}
}

checkConfig();
</script>
</body>
</html>
