<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红果短剧下载器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #e94560; margin: 20px 0; font-size: 28px; }
h3 { color: #e94560; margin-bottom: 10px; }
.card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
input, button { padding: 12px 16px; border: none; border-radius: 8px; font-size: 14px; }
input { background: #16213e; color: #fff; flex: 1; outline: none; }
button { background: #e94560; color: #fff; cursor: pointer; font-weight: 600; }
button:hover { opacity: 0.85; }
button.secondary { background: #0f3460; }
button.danger { background: #c0392b; padding: 6px 12px; font-size: 12px; }
button.small { padding: 6px 12px; font-size: 12px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px; }
.ep { background: #16213e; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; border: 2px solid transparent; font-size: 13px; }
.ep.selected { border-color: #e94560; background: #1a1a3e; }
.progress-bar { background: #16213e; border-radius: 8px; height: 24px; overflow: hidden; margin: 12px 0; }
.progress-fill { background: linear-gradient(90deg, #e94560, #ff6b9d); height: 100%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
.info { display: flex; align-items: center; gap: 16px; }
.cover { width: 120px; border-radius: 8px; }
.ep-title { font-size: 18px; font-weight: 700; }
.ep-meta { color: #888; font-size: 13px; margin-top: 4px; }
.hidden { display: none; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.error { color: #ff6b6b; padding: 10px; background: #2a1a1a; border-radius: 8px; margin: 8px 0; }
.drama-item { padding: 12px; border-bottom: 1px solid #333; }
.drama-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
.drama-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.drama-cover { width: 48px; height: 64px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #16213e; }
.drama-text { min-width: 0; }
.drama-name { font-weight: 700; }
.drama-meta { color: #888; font-size: 12px; }
.drama-actions { display: flex; gap: 8px; }
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
.file-chip { background: #16213e; padding: 6px 10px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.file-chip button { padding: 2px 6px; font-size: 11px; }
#loginOverlay { position: fixed; inset: 0; background: rgba(15,15,26,0.97); display: flex; align-items: center; justify-content: center; z-index: 999; }
#loginOverlay .login-box { background: #1a1a2e; padding: 40px; border-radius: 16px; text-align: center; width: 320px; }
#loginOverlay h2 { color: #e94560; margin-bottom: 20px; }
#loginOverlay input { width: 100%; margin-bottom: 12px; }
#loginOverlay button { width: 100%; }
#loginError { color: #ff6b6b; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔒 请输入密码</h2>
    <input type="password" id="loginPwd" placeholder="访问密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登录</button>
    <div id="loginError"></div>
  </div>
</div>
<div class="container">
<h1>🎬 红果短剧下载器</h1>
<div class="card">
  <div class="row">
    <input id="urlInput" placeholder="粘贴分享链接或 series_id">
    <button onclick="parseDrama()">解析</button>
  </div>
</div>
<div id="infoCard" class="card hidden">
  <div class="info">
    <img id="cover" class="cover" src="">
    <div>
      <div class="ep-title" id="dramaTitle"></div>
      <div class="ep-meta" id="dramaMeta"></div>
    </div>
  </div>
  <div class="btn-group">
    <button class="secondary small" onclick="selectAll(true)">全选</button>
    <button class="secondary small" onclick="selectAll(false)">全不选</button>
    <button class="secondary small" onclick="selectRange(1,10)">前10集</button>
    <button class="secondary small" onclick="selectRange(-30,-1)">后30集</button>
  </div>
  <div class="ep-grid" id="epGrid"></div>
  <div class="row" style="margin-top:16px">
    <button onclick="startDownload()">开始下载选中集数</button>
  </div>
</div>
<div id="progressCard" class="card hidden">
  <h3>下载进度</h3>
  <div id="progressText"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%">0%</div></div>
  <div id="errorList"></div>
</div>
<div class="card">
  <h3>已下载文件</h3>
  <div id="fileList"></div>
</div>
</div>
<script>
let episodes = [];
let currentSeriesId = '';
let selectedEps = new Set();
let pollTimer = null;
let authToken = localStorage.getItem('authToken') || '';
async function apiFetch(url, options = {}) {
  options.headers = options.headers || {};
  options.headers['X-Auth-Token'] = authToken;
  const r = await fetch(url, options);
  if (r.status === 401) { document.getElementById('loginOverlay').style.display = 'flex'; throw new Error('未授权'); }
  return r;
}
async function checkConfig() {
  const r = await fetch('/api/config');
  const d = await r.json();
  if (!d.need_auth) { document.getElementById('loginOverlay').style.display = 'none'; loadFiles(); }
  else if (authToken) { try { await apiFetch('/api/files'); document.getElementById('loginOverlay').style.display = 'none'; loadFiles(); } catch(e) { authToken=''; localStorage.removeItem('authToken'); } }
}
async function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password: pwd})});
  const d = await r.json();
  if (d.code === 0) { authToken = pwd; localStorage.setItem('authToken', pwd); document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('loginError').textContent=''; loadFiles(); }
  else { document.getElementById('loginError').textContent = d.msg || '密码错误'; }
}
async function parseDrama() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  try {
    const r = await apiFetch('/api/parse', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
    const d = await r.json();
    if (d.code !== 0) { alert('解析失败: ' + d.msg); return; }
    const info = d.data;
    episodes = info.episodes;
    currentSeriesId = info.series_id;
    selectedEps = new Set(episodes.map(e => e.vid_index));
    document.getElementById('dramaTitle').textContent = info.series_title;
    document.getElementById('dramaMeta').textContent = `共 ${episodes.length} 集`;
    if (info.cover) document.getElementById('cover').src = info.cover;
    renderEpGrid();
    document.getElementById('infoCard').classList.remove('hidden');
  } catch(e) { alert('错误: ' + e.message); }
}
function renderEpGrid() {
  const grid = document.getElementById('epGrid');
  grid.innerHTML = '';
  episodes.forEach(ep => {
    const div = document.createElement('div');
    div.className = 'ep' + (selectedEps.has(ep.vid_index) ? ' selected' : '');
    div.textContent = ep.vid_index;
    div.onclick = () => { if (selectedEps.has(ep.vid_index)) selectedEps.delete(ep.vid_index); else selectedEps.add(ep.vid_index); renderEpGrid(); };
    grid.appendChild(div);
  });
}
function selectAll(sel) { selectedEps = sel ? new Set(episodes.map(e => e.vid_index)) : new Set(); renderEpGrid(); }
function selectRange(a, b) {
  const n = episodes.length;
  const start = a > 0 ? a - 1 : n + a;
  const end = b > 0 ? b : n + b;
  for (let i = start; i <= end; i++) selectedEps.add(i + 1);
  renderEpGrid();
}
async function startDownload() {
  if (!currentSeriesId) { alert('请先解析剧集'); return; }
  const eps = Array.from(selectedEps);
  if (eps.length === 0) { alert('请先选择要下载的集数'); return; }
  const resp = await apiFetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({series_id: currentSeriesId, episodes: eps})});
  const j = await resp.json();
  if (j.code !== 0) { alert('下载启动失败: ' + j.msg); return; }
  document.getElementById('progressCard').classList.remove('hidden');
  pollProgress(j.task_id);
}
function pollProgress(tid) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await apiFetch('/api/progress/' + tid);
      const d = await r.json();
      if (d.code !== 0) return;
      const t = d.data;
      const pct = t.total > 0 ? Math.round(t.done / t.total * 100) : 0;
      document.getElementById('progressText').innerHTML = `${t.done}/${t.total} ${t.current}`;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressFill').textContent = pct + '%';
      if (t.errors.length) document.getElementById('errorList').innerHTML = t.errors.map(e => '<div class="error">❌ ' + e + '</div>').join('');
      if (t.status === 'done' || t.status === 'error') { clearInterval(pollTimer); loadFiles(); }
    } catch(e) {}
  }, 2000);
}
async function deleteDrama(name) {
  if (!confirm(`确定删除《${name}》全部文件？`)) return;
  await apiFetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama: name})});
  loadFiles();
}
async function deleteFile(drama, filename) {
  if (!confirm(`删除 ${filename}？`)) return;
  await apiFetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama, filename})});
  loadFiles();
}
async function mergeDrama(name) {
  if (!confirm(`合并《${name}》所有集数为一个视频？（不重编码，速度很快）`)) return;
  const btn = event.target;
  btn.disabled = true; btn.textContent = '合并中...';
  const r = await apiFetch('/api/merge', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama: name})});
  const d = await r.json();
  if (d.code === 0) { alert(`合并完成: ${d.data.file} (${d.data.size_mb}MB)`); loadFiles(); }
  else { alert('合并失败: ' + d.msg); }
  btn.disabled = false; btn.textContent = '合并全集';
}
async function loadFiles() {
  try {
    const r = await apiFetch('/api/files');
    const d = await r.json();
    const el = document.getElementById('fileList');
    if (d.data.length === 0) { el.innerHTML = '<div style="color:#666">暂无下载</div>'; return; }
    el.innerHTML = d.data.map(drama => `
      <div class="drama-item">
        <div class="drama-header">
          <div class="drama-info">
            ${drama.cover ? `<img class="drama-cover" src="${drama.cover}" loading="lazy">` : ''}
            <div class="drama-text">
              <div class="drama-name">📁 ${drama.title || drama.name}</div>
              <div class="drama-meta">${drama.count}集 · ${drama.size_mb}MB</div>
            </div>
          </div>
          <div class="drama-actions">
            <button class="small secondary" onclick="mergeDrama('${drama.name}')">合并全集</button>
            <button class="small danger" onclick="deleteDrama('${drama.name}')">删除</button>
          </div>
        </div>
        <div class="file-grid">
          ${drama.files.map(f => `<div class="file-chip"><span>${f}</span><button onclick="deleteFile('${drama.name}','${f}')">✕</button></div>`).join('')}
        </div>
      </div>
    `).join('');
  } catch(e) {}
}
checkConfig();
</script>
</body>
</html>
