name: Release

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        run: base64 -d android/hongguo.keystore.b64 > android/hongguo.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Delete existing release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true

      - name: Create release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 \
            --title "红果短剧下载器 v1.0" \
            --notes "红果短剧下载器，支持 Docker NAS 部署和 Android APK。" \
            --target main \
            android/app/build/outputs/apk/debug/app-debug.apk \
            docker-compose.yml
