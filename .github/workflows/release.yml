name: Release

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/', 'README.md', 'docker-compose.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        run: base64 -d android/hongguo.keystore.b64 > android/hongguo.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APKs
        working-directory: android
        run: gradle assembleFullDebug assembleNasDebug --no-daemon

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/full/debug/app-full-debug.apk hongguo-dl-quan.apk
          cp android/app/build/outputs/apk/nas/debug/app-nas-debug.apk hongguo-dl-nas.apk

      - name: Pull Docker image and save as tar
        run: |
          docker pull gybeyond/hongguo-dl:latest
          docker save gybeyond/hongguo-dl:latest | gzip > hongguo-dl-docker.tar.gz

      - name: Delete existing release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true
          git tag -d v1.0 2>/dev/null || true
          git push origin :refs/tags/v1.0 2>/dev/null || true

      - name: Create release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 \
            --title "红果短剧下载器 v1.0" \
            --notes "红果短剧下载器" \
            --target main

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0 hongguo-dl-quan.apk --clobber
          gh release upload v1.0 hongguo-dl-nas.apk --clobber
          gh release upload v1.0 hongguo-dl-docker.tar.gz --clobber
          gh release upload v1.0 docker-compose.yml --clobber
