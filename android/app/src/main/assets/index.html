<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>红果下载器</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--input:#16213e;--accent:#e94560;--blue:#0f3460;--green:#2ecc71;--orange:#ff9f43;--red:#ff6b6b;--text:#e0e0e0;--dim:#888;--border:#2a2a4a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
.topbar{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.topbar h1{font-size:16px;color:var(--accent);flex:1}
.settings-btn{background:none;border:none;font-size:20px;padding:4px 8px}
.container{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px}
input,button{padding:11px 14px;border:none;border-radius:8px;font-size:14px;outline:none}
input{background:var(--input);color:#fff;flex:1;min-width:0}
button{background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
button:active{opacity:.8}
button.sec{background:var(--blue)}
button.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.row{display:flex;gap:8px;margin-bottom:10px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px;margin-top:10px}
.ep{background:var(--input);padding:9px 4px;text-align:center;border-radius:7px;cursor:pointer;border:2px solid transparent;font-size:12px}
.ep.sel{border-color:var(--accent);background:rgba(233,69,96,.15)}
.hidden{display:none!important}
.cover-lg{width:90px;border-radius:8px;aspect-ratio:3/4;object-fit:cover;flex-shrink:0;background:var(--input)}
.info-row{display:flex;gap:12px;margin-bottom:12px}
.mode-pick{display:flex;gap:8px;margin:10px 0}
.mode-pick button{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--input);color:var(--text);font-size:13px}
.mode-pick button.picked{border-color:var(--accent);background:rgba(233,69,96,.15);color:var(--accent)}
.error-box{color:var(--red);padding:5px 8px;background:rgba(192,57,43,.1);border-radius:6px;margin:4px 0;font-size:11px;word-break:break-all;overflow-wrap:break-word}
.progress-bar{background:var(--input);border-radius:4px;height:6px;margin-top:6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--accent),#ff6b9d);height:100%;transition:width .3s}
.settings-panel{position:fixed;inset:0;background:rgba(15,15,26,.97);z-index:200;display:none;align-items:center;justify-content:center}
.settings-panel.show{display:flex}
.settings-box{background:var(--card);padding:24px;border-radius:14px;width:min(340px,90vw)}
.settings-box h2{color:var(--accent);margin-bottom:16px;font-size:18px}
.settings-box input{width:100%;margin-bottom:8px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎬 红果下载器</h1>
  <button class="settings-btn" onclick="showDownloaded()">📁</button>
  <button class="settings-btn" onclick="showSettings()">⚙️</button>
</div>

<div class="container">
  <div class="card">
    <div class="row">
      <input id="urlInput" placeholder="粘贴分享链接">
      <button onclick="parseDrama()">解析</button>
    </div>
  </div>

  <div id="infoCard" class="card hidden">
    <div class="info-row">
      <img id="cover" class="cover-lg" src="" onerror="this.style.display='none'">
      <div>
        <div id="dramaTitle" style="font-size:17px;font-weight:700"></div>
        <div id="dramaMeta" style="color:var(--dim);font-size:12px;margin-top:4px"></div>
      </div>
    </div>
    <div class="row">
      <button class="sec sm" onclick="selectAll(true)">全选</button>
      <button class="sec sm" onclick="selectAll(false)">取消</button>
    </div>
    <div class="ep-grid" id="epGrid"></div>
    <div class="mode-pick">
      <button id="pickLocal" onclick="pickTarget('local')">📱 下载到本地</button>
      <button id="pickCloud" onclick="pickTarget('cloud')">☁️ 下载到NAS</button>
    </div>
    <button style="width:100%;padding:13px;font-size:15px;border-radius:8px;margin-top:12px" onclick="startDownload()">⬇️ 开始下载</button>
  </div>

  <div id="progressCard" class="card hidden">
    <div class="card-title">📊 下载进度</div>
    <div id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div id="errorList"></div>
  </div>

  <div id="downloadedCard" class="card hidden">
    <div class="card-title">📁 已下载</div>
    <div id="downloadedList"></div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-box">
    <h2>⚙️ NAS 连接</h2>
    <input id="setHost" placeholder="NAS 地址 (如 http://192.168.31.76:8800)">
    <input id="setPwd" type="password" placeholder="访问密钥">
    <div class="row">
      <button class="sec" style="flex:1" onclick="testConnection()">测试连接</button>
      <button style="flex:1" onclick="saveSettings()">保存</button>
      <button class="sec" style="flex:1" onclick="closeSettings()">关闭</button>
    </div>
  </div>
</div>

<script>
const API='https://api5-normal-sinfonlineb.fqnovel.com';
const COMMON_Q={klink_egdi:"AAI29o4dI-eMiO73_SRSbZ_0By1v3fUSriNeu8-L951MoXhWT88pzj5B",iid:"3788260546453235",device_id:"538083340353620",ac:"wifi",channel:"oppo_8662_64",aid:"8662",app_name:"novelread",version_code:"71532",version_name:"7.1.5.32",device_platform:"android",os:"android",ssmix:"a",device_type:"SM-N9860",device_brand:"Samsung",language:"zh",os_api:"28",os_version:"9",manifest_version_code:"71532",resolution:"900*1600",dpi:"320",update_version_code:"71532",host_abi:"arm64-v8a",dragon_device_type:"pad",pv_player:"71532",compliance_status:"0",need_personal_recommend:"1",player_so_load:"1",is_android_pad_screen:"0",rom_version:"PQ3A.190705.10241111+release-keys",cdid:"b4f93387-5319-4134-aab9-2cd4e9279b8f"};
const DETAIL_BIZ_PARAM={detail_page_version:0,disable_digg_stat:false,image_shrink_datas_str:"W3siaW1hZ2VfdHlwZSI6MywiaW1hZ2Vfd2lkdGgiOjkwMCwic2hyaW5rX3R5cGUiOjN9LHsiaW1hZ2VfdHlwZSI6NCwiaW1hZ2Vfd2lkdGgiOjcyLCJzaHJpbmtfdHlwZSI6NH1d",need_all_video_definition:false,need_mp4_align:false,screen_width_px:"900",source:7,use_os_player:false,use_server_dns:false};
const MODEL_BIZ_PARAM={detail_page_version:0,device_level:3,disable_digg_stat:false,need_all_video_definition:true,need_mp4_align:false,use_os_player:false,use_server_dns:false,video_platform:1024};

let episodes=[],currentSeriesId='',selectedEps=new Set(),downloadDir='/sdcard/Download/HG_Download';
let currentTitle='',currentCover='';
let cloudHost='',cloudPwd='',downloadTarget='local';
let httpCallbackId=0,httpCallbacks={};
let fileDlId=0,fileCallbacks={};

function buildUrl(path){
  const q=new URLSearchParams(COMMON_Q);
  q.set('_rticket',String(Date.now()));
  return API+path+'?'+q.toString();
}

function apiCall(path,body){
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve,reject};
    AndroidBridge.httpRequest(buildUrl(path),'POST',JSON.stringify(body),id);
  });
}

function httpGet(url){
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve,reject};
    AndroidBridge.httpRequest(url,'GET','',id);
  });
}

window.onHttpResponse=(id,code,finalUrl,body)=>{
  if(httpCallbacks[id]){
    httpCallbacks[id].resolve({status:code,url:finalUrl,text:body,json:()=>Promise.resolve(JSON.parse(body))});
    delete httpCallbacks[id];
  }
};
window.onHttpError=(id,msg)=>{
  if(httpCallbacks[id]){httpCallbacks[id].reject(new Error(msg));delete httpCallbacks[id]}
};
window.onFileDownloaded=(path)=>{
  for(const fid in fileCallbacks){if(fileCallbacks[fid].path===path){fileCallbacks[fid].res();delete fileCallbacks[fid]}}
};
window.onFileError=(msg)=>{
  for(const fid in fileCallbacks){fileCallbacks[fid].rej(new Error(msg));delete fileCallbacks[fid]}
};

async function resolveSeriesId(url){
  url=url.trim();
  if(/^\d+$/.test(url))return url;
  const m=url.match(/https?:\/\/[^\s<>"'，。]+/);
  if(m)url=m[0].replace(/[.,;:!?，。；：！？]+$/,'');
  const r=await httpGet(url);
  const finalUrl=r.url;
  let m2=finalUrl.match(/video_series_id=(\d+)/);
  if(m2)return m2[1];
  m2=finalUrl.match(/schemeParams[^&]*/);
  if(m2){
    try{
      const raw=decodeURIComponent(decodeURIComponent(m2[0]));
      const jm=raw.match(/"video_id"\s*:\s*"(\d+)"/);
      if(jm)return jm[1];
    }catch(e){}
  }
  const body=r.text||'';
  m2=body.match(/video_series_id=(\d+)/)||body.match(/"video_id"\s*:\s*"(\d+)"/)||body.match(/"series_id"\s*:\s*"(\d+)"/);
  if(m2)return m2[1];
  throw new Error('无法解析链接');
}

async function parseDrama(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){AndroidBridge.toast('请输入链接');return}
  AndroidBridge.toast('解析中...');
  try{
    const sid=await resolveSeriesId(url);
    const r=await apiCall('/novel/player/multi_video_detail/preload/v1',{biz_param:DETAIL_BIZ_PARAM,dr_scene:"preload",series_id:sid});
    const j=await r.json();
    if(j.code!==0)throw new Error(j.message||'API错误');
    const d=j.data;
    const sid2=Object.keys(d)[0];
    const vd=d[sid2].video_data||{};
    const vl=vd.video_list||[];
    episodes=vl.map((v,i)=>({vid_index:i+1,vid:String(v.vid)}));
    currentSeriesId=sid;
    selectedEps=new Set(episodes.map(e=>e.vid_index));
    currentTitle=vd.series_title||vd.title||vd.book_name||'未命名';
    currentCover=vd.series_cover||vd.cover_url||vd.book_pic||'';
    document.getElementById('dramaTitle').textContent=currentTitle;
    document.getElementById('dramaMeta').textContent=`共${episodes.length}集`;
    if(vd.cover_url){document.getElementById('cover').src=vd.cover_url;document.getElementById('cover').style.display=''}
    renderEpGrid();
    document.getElementById('infoCard').classList.remove('hidden');
    AndroidBridge.toast('解析成功');
  }catch(e){AndroidBridge.toast('解析失败: '+e.message)}
}

let dragStart=null,dragSelectMode=true,dragTimer=null,dragActive=false,touchStartX=0,touchStartY=0;
function renderEpGrid(){
  const g=document.getElementById('epGrid');g.innerHTML='';
  episodes.forEach(ep=>{
    const d=document.createElement('div');
    d.className='ep'+(selectedEps.has(ep.vid_index)?' sel':'');
    d.textContent=ep.vid_index;
    d.dataset.ep=ep.vid_index;
    d.addEventListener('touchstart',e=>{
      dragActive=false;
      dragStart=ep.vid_index;
      dragSelectMode=!selectedEps.has(ep.vid_index);
      touchStartX=e.touches[0].clientX;
      touchStartY=e.touches[0].clientY;
      dragTimer=setTimeout(()=>{
        dragActive=true;
        toggleEp(ep.vid_index);
      },500);
    });
    d.addEventListener('touchmove',e=>{
      if(!dragActive){
        const dx=Math.abs(e.touches[0].clientX-touchStartX);
        const dy=Math.abs(e.touches[0].clientY-touchStartY);
        if(dx>10||dy>10){clearTimeout(dragTimer);dragStart=null}
        return;
      }
      e.preventDefault();
      const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
      if(t&&t.dataset.ep){
        const cur=parseInt(t.dataset.ep);
        const s=Math.min(dragStart,cur),en=Math.max(dragStart,cur);
        for(let i=s;i<=en;i++){
          if(dragSelectMode)selectedEps.add(i);else selectedEps.delete(i);
        }
        renderEpGrid();
      }
    },{passive:false});
    d.addEventListener('touchend',e=>{
      clearTimeout(dragTimer);
      if(!dragActive&&dragStart!=null){
        const dx=Math.abs(e.changedTouches[0].clientX-touchStartX);
        const dy=Math.abs(e.changedTouches[0].clientY-touchStartY);
        if(dx<10&&dy<10)toggleEp(dragStart);
      }
      dragStart=null;dragActive=false;
    });
    g.appendChild(d);
  });
}
function toggleEp(n){selectedEps.has(n)?selectedEps.delete(n):selectedEps.add(n);renderEpGrid()}
function selectAll(s){selectedEps=s?new Set(episodes.map(e=>e.vid_index)):new Set();renderEpGrid()}
function selectRange(a,b){const n=episodes.length,s=a>0?a-1:n+a,e=b>0?b:n+b;for(let i=s;i<=e;i++)selectedEps.add(i+1);renderEpGrid()}

function pickTarget(t){
  downloadTarget=t;
  document.getElementById('pickLocal').classList.toggle('picked',t==='local');
  document.getElementById('pickCloud').classList.toggle('picked',t==='cloud');
}
pickTarget('local');

async function startDownload(){
  if(!currentSeriesId){AndroidBridge.toast('请先解析');return}
  const eps=[...selectedEps];if(!eps.length){AndroidBridge.toast('请选择集数');return}
  if(downloadTarget==='cloud'&&!cloudHost){AndroidBridge.toast('请先在设置配置NAS');return}
  document.getElementById('progressCard').classList.remove('hidden');
  document.getElementById('errorList').innerHTML='';

  if(downloadTarget==='cloud'){
    try{
      const id='cb'+(++httpCallbackId);
      httpCallbacks[id]={resolve:()=>{},reject:()=>{}};
      AndroidBridge.httpRequest(`${cloudHost}/api/download`,'POST',JSON.stringify({series_id:currentSeriesId,episodes:eps}),id);
      // Save meta to local
      AndroidBridge.writeFile(downloadDir+'/'+currentSeriesId+'/.meta.json',JSON.stringify({source:'cloud',title:currentTitle,cover:currentCover}));
      AndroidBridge.toast('已提交到NAS');
      document.getElementById('progressText').textContent='已提交到NAS处理';
    }catch(e){AndroidBridge.toast('云端请求失败: '+e.message)}
    return;
  }

  const safeTitle=(currentTitle||currentSeriesId).replace(/[\\/:*?"<>|]/g,'_');
  const dramaDir=downloadDir+'/'+safeTitle;
  AndroidBridge.runCommand('mkdir -p '+dramaDir,'mkdir');
  AndroidBridge.writeFile(dramaDir+'/.meta.json',JSON.stringify({source:'local',title:currentTitle,cover:currentCover,id:currentSeriesId}));
  let done=0,failed=[];
  for(const idx of eps){
    document.getElementById('progressText').textContent=`获取播放地址 ${done+1}/${eps.length} (第${idx}集)`;
    document.getElementById('progressFill').style.width=Math.round(done/eps.length*100)+'%';
    try{
      const ep=episodes.find(e=>e.vid_index===idx);
      const r=await apiCall('/novel/player/multi_video_model/preload/v1',{biz_param:MODEL_BIZ_PARAM,dr_scene:"preload",mixed_video_id_map:{1004:[ep.vid]}});
      const j=await r.json();
      if(j.code!==0)throw new Error(j.message||'API错误');
      const item=j.data[ep.vid]||{};
      let vm=item.video_model;
      if(typeof vm==='string')vm=JSON.parse(vm);
      const vl=vm.video_list||[];
      let best=null,bestScore=-1,bestKey='';
      for(const v of vl){
        const meta=v.video_meta||{};
        const defn=String(meta.definition||'');
        const dm=defn.match(/(\d+)/);
        const p=dm?parseInt(dm[1]):0;
        const w=parseInt(meta.vwidth||0),h=parseInt(meta.vheight||0),br=parseInt(meta.bitrate||0);
        const score=p*1000000+w*h+br;
        if(score>bestScore){bestScore=score;best=v.main_url;bestKey=(v.encrypt_info||{}).spade_a||'';}
      }
      if(!best)throw new Error('无播放地址');
      const outPath=dramaDir+'/'+String(idx).padStart(3,'0')+'_第'+idx+'集.mp4';
      const dlLabel=bestKey?'下载+解密':'下载';
      document.getElementById('progressText').textContent=`${dlLabel} ${done+1}/${eps.length} (第${idx}集)`;
      await new Promise((res,rej)=>{
        const fid='fd'+(++fileDlId);
        fileCallbacks[fid]={res,rej,path:outPath};
        if(bestKey){
          AndroidBridge.downloadDecryptFile(best,bestKey,outPath+'|'+fid);
        }else{
          AndroidBridge.downloadFile(best,outPath+'|'+fid);
        }
        setTimeout(()=>{if(fileCallbacks[fid]){fileCallbacks[fid].res();delete fileCallbacks[fid]}},120000);
      });
    }catch(e){failed.push({ep:idx,err:e.message})}
    done++;
  }
  document.getElementById('progressText').textContent=failed.length?`完成，${failed.length}个失败`:'全部完成';
  document.getElementById('progressFill').style.width='100%';
  if(failed.length){
    document.getElementById('errorList').innerHTML=failed.map(f=>{
      const short=f.err.length>60?f.err.slice(0,60)+'...':f.err;
      return `<div class="error-box">❌ 第${f.ep}集: ${short} <button class="sm" style="margin-left:8px;padding:2px 8px" onclick="retryEp(${f.ep})">重试</button></div>`;
    }).join('');
  }
}

function retryEp(idx){
  AndroidBridge.toast('重试第'+idx+'集...');
  startDownload();
}

function showSettings(){document.getElementById('settingsPanel').classList.add('show')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('show')}

function onSettingsLoaded(host,port,pwd){
  cloudHost=host||'';cloudPwd=pwd||'';
  document.getElementById('setHost').value=cloudHost;
  document.getElementById('setPwd').value=cloudPwd;
  if(cloudPwd&&window.AndroidBridge)AndroidBridge.setAuthToken(cloudPwd);
}

function testConnection(){
  const host=document.getElementById('setHost').value.trim();
  const pwd=document.getElementById('setPwd').value;
  if(!host){AndroidBridge.toast('请先填写地址');return}
  AndroidBridge.toast('正在测试...');
  const rid='cb'+(++httpCallbackId);
  httpCallbacks[rid]={
    resolve:(r)=>{
      try{const j=JSON.parse(r);AndroidBridge.toast(j.code===0?'连接成功':'连接失败: '+j.msg)}
      catch(e){AndroidBridge.toast('连接失败: 响应格式错误')}
    },
    reject:(e)=>AndroidBridge.toast('连接失败: '+e)
  };
  AndroidBridge.setAuthToken(pwd);
  AndroidBridge.httpRequest(host+'/api/config','GET','',rid);
}

function saveSettings(){
  cloudHost=document.getElementById('setHost').value.trim().replace(/\/$/,'');
  cloudPwd=document.getElementById('setPwd').value;
  AndroidBridge.saveSettings(cloudHost,'',cloudPwd);
  if(cloudPwd)AndroidBridge.setAuthToken(cloudPwd);
  closeSettings();
}

function onSharedText(text){
  const m=text.match(/https?:\/\/[^\s<>"'，。）)]+/);
  if(m){
    document.getElementById('urlInput').value=m[0];
    parseDrama();
  }else{
    AndroidBridge.toast('未找到链接');
  }
}

if(window.AndroidBridge)downloadDir=AndroidBridge.getDownloadDir();

async function showDownloaded(){
  const card=document.getElementById('downloadedCard');
  card.classList.remove('hidden');
  const list=document.getElementById('downloadedList');
  try{
    const dirs=JSON.parse(AndroidBridge.listDir(downloadDir));
    const items=dirs.filter(d=>d.isDir).map(d=>{
      const files=JSON.parse(AndroidBridge.listDir(downloadDir+'/'+d.name));
      const mps=files.filter(f=>f.name.endsWith('.mp4'));
      let source='local',title=d.name,cover='';
      const metaFile=files.find(f=>f.name==='.meta.json');
      if(metaFile){try{const m=JSON.parse(AndroidBridge.readFile(downloadDir+'/'+d.name+'/.meta.json'));source=m.source||'local';title=m.title||d.name;cover=m.cover||''}catch(e){}}
      return {id:d.name,count:mps.length,size:mps.reduce((s,f)=>s+f.size,0),source,title,cover};
    }).filter(x=>x.count>0);
    if(!items.length){list.innerHTML='<div style="color:var(--dim)">暂无下载</div>';return}
    list.innerHTML=items.map(it=>`
      <div style="background:var(--input);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;gap:10px">
        <img src="${it.cover}" style="width:50px;height:67px;border-radius:6px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="font-size:14px;font-weight:600;flex:1">${it.title}</div>
            <span style="font-size:11px;padding:2px 6px;border-radius:4px;background:${it.source==='cloud'?'rgba(46,204,113,.2)':'rgba(52,152,219,.2)'};color:${it.source==='cloud'?'#2ecc71':'#3498db'}">${it.source==='cloud'?'☁️ NAS':'📱 本地'}</span>
          </div>
          <div style="color:var(--dim);font-size:12px;margin-top:4px">${it.count}集 · ${(it.size/1048576).toFixed(1)}MB</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="sm" style="background:var(--green)" onclick="mergeDrama('${it.id}','${it.source}')">🔗 合并</button>
            <button class="sm" style="background:#e74c3c" onclick="deleteDrama('${it.id}')">🗑 删除</button>
          </div>
        </div>
      </div>`).join('');
  }catch(e){list.innerHTML='<div class="error-box">读取失败: '+e.message+'</div>'}
}

function deleteDrama(id){
  if(!confirm('确认删除这部剧的所有文件？'))return;
  AndroidBridge.deleteDrama(downloadDir+'/'+id);
  AndroidBridge.toast('已删除');
  showDownloaded();
}

window.onMergeDone=(cid,code,msg)=>{
  if(code===0){AndroidBridge.toast('合并完成');showDownloaded()}
  else{AndroidBridge.toast('合并失败: '+msg.slice(0,100))}
};

window.onFfmpegDownloaded=(path)=>{AndroidBridge.toast('ffmpeg下载完成');};
window.onFfmpegError=(msg)=>{AndroidBridge.toast('ffmpeg下载失败: '+msg);};

function mergeDrama(id,source){
  if(source==='cloud'){
    if(!cloudHost){AndroidBridge.toast('请先配置NAS');return}
    if(confirm('确认提交到NAS合并？')){
      AndroidBridge.toast('正在提交NAS合并...');
      const rid='cb'+(++httpCallbackId);
      httpCallbacks[rid]={resolve:()=>{AndroidBridge.toast('合并任务已提交');},reject:()=>{}};
      AndroidBridge.httpRequest(`${cloudHost}/api/merge`,'POST',JSON.stringify({drama:id}),rid);
    }
    return;
  }
  // Local merge: use bundled ffmpeg
  const ffmpegPath = AndroidBridge.getFfmpegPath();
  if(!ffmpegPath){
    if(!confirm('首次合并需要解压内置FFmpeg，是否继续？'))return;
    AndroidBridge.downloadFfmpeg('dlff');
    AndroidBridge.toast('正在解压FFmpeg...');
    return;
  }
  if(!confirm('确认合并本地已下载的剧集？'))return;
  const dramaDir = AndroidBridge.getDownloadDir()+ '/'+id;
  const outPath = AndroidBridge.getDownloadDir()+ '/'+id+'.mp4';
  AndroidBridge.mergeVideos(dramaDir, outPath, 'mg'+Date.now());
  AndroidBridge.toast('本地合并中...');
}
</script>
