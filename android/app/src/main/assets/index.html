<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>红果下载器</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--input:#16213e;--accent:#e94560;--blue:#0f3460;--green:#2ecc71;--orange:#ff9f43;--red:#ff6b6b;--text:#e0e0e0;--dim:#888;--border:#2a2a4a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
.topbar{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.topbar h1{font-size:16px;color:var(--accent);flex:1}
.settings-btn{background:none;border:none;font-size:20px;padding:4px 8px}
.container{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px}
input,button{padding:11px 14px;border:none;border-radius:8px;font-size:14px;outline:none}
input{background:var(--input);color:#fff;flex:1;min-width:0}
button{background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
button:active{opacity:.8}
button.sec{background:var(--blue)}
button.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.row{display:flex;gap:8px;margin-bottom:10px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px;margin-top:10px}
.ep{background:var(--input);padding:9px 4px;text-align:center;border-radius:7px;cursor:pointer;border:2px solid transparent;font-size:12px}
.ep.sel{border-color:var(--accent);background:rgba(233,69,96,.15)}
.hidden{display:none!important}
.cover-lg{width:90px;border-radius:8px;aspect-ratio:3/4;object-fit:cover;flex-shrink:0;background:var(--input)}
.info-row{display:flex;gap:12px;margin-bottom:12px}
.mode-pick{display:flex;gap:8px;margin:10px 0}
.mode-pick button{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--input);color:var(--text);font-size:13px}
.mode-pick button.picked{border-color:var(--accent);background:rgba(233,69,96,.15);color:var(--accent)}
.error-box{color:var(--red);padding:5px 8px;background:rgba(192,57,43,.1);border-radius:6px;margin:4px 0;font-size:11px}
.progress-bar{background:var(--input);border-radius:4px;height:6px;margin-top:6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--accent),#ff6b9d);height:100%;transition:width .3s}
.settings-panel{position:fixed;inset:0;background:rgba(15,15,26,.97);z-index:200;display:none;align-items:center;justify-content:center}
.settings-panel.show{display:flex}
.settings-box{background:var(--card);padding:24px;border-radius:14px;width:min(340px,90vw)}
.settings-box h2{color:var(--accent);margin-bottom:16px;font-size:18px}
.settings-box input{width:100%;margin-bottom:8px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎬 红果下载器</h1>
  <button class="settings-btn" onclick="showSettings()">⚙️</button>
</div>

<div class="container">
  <div class="card">
    <div class="row">
      <input id="urlInput" placeholder="粘贴分享链接">
      <button onclick="parseDrama()">解析</button>
    </div>
  </div>

  <div id="infoCard" class="card hidden">
    <div class="info-row">
      <img id="cover" class="cover-lg" src="" onerror="this.style.display='none'">
      <div>
        <div id="dramaTitle" style="font-size:17px;font-weight:700"></div>
        <div id="dramaMeta" style="color:var(--dim);font-size:12px;margin-top:4px"></div>
      </div>
    </div>
    <div class="row">
      <button class="sec sm" onclick="selectAll(true)">全选</button>
      <button class="sec sm" onclick="selectAll(false)">取消</button>
      <button class="sec sm" onclick="selectRange(1,10)">前10</button>
      <button class="sec sm" onclick="selectRange(-30,-1)">后30</button>
    </div>
    <div class="ep-grid" id="epGrid"></div>
    <div class="mode-pick">
      <button id="pickLocal" onclick="pickTarget('local')">📱 下载到本地</button>
      <button id="pickCloud" onclick="pickTarget('cloud')">☁️ 下载到NAS</button>
    </div>
    <button style="width:100%;padding:13px;font-size:15px;border-radius:8px;margin-top:12px" onclick="startDownload()">⬇️ 开始下载</button>
  </div>

  <div id="progressCard" class="card hidden">
    <div class="card-title">📊 下载进度</div>
    <div id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div id="errorList"></div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-box">
    <h2>⚙️ NAS 连接</h2>
    <input id="setHost" placeholder="NAS 地址 (如 192.168.31.76)">
    <input id="setPort" placeholder="端口 (如 8800)">
    <input id="setPwd" type="password" placeholder="访问密码">
    <div class="row">
      <button style="flex:1" onclick="saveSettings()">保存</button>
      <button class="sec" style="flex:1" onclick="closeSettings()">关闭</button>
    </div>
  </div>
</div>

<script>
const API_BASE='https://api5-normal-sinfonlineb.fqnovel.com';
let episodes=[],currentSeriesId='',selectedEps=new Set(),downloadDir='/sdcard/Download/HG_Download';
let cloudHost='',cloudPort='8800',cloudPwd='',downloadTarget='local';
let httpCallbackId=0,httpCallbacks={};

function nativePost(path,body){
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve,reject};
    AndroidBridge.httpRequest(API_BASE+path,'POST',JSON.stringify(body),id);
  });
}
window.onHttpResponse=(id,code,body)=>{
  if(httpCallbacks[id]){
    try{httpCallbacks[id].resolve({status:code,json:()=>Promise.resolve(JSON.parse(body))})}
    catch(e){httpCallbacks[id].reject(e)}
    delete httpCallbacks[id];
  }
};
window.onHttpError=(id,msg)=>{
  if(httpCallbacks[id]){httpCallbacks[id].reject(new Error(msg));delete httpCallbacks[id]}
};

function nativeGet(url){
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve,reject};
    AndroidBridge.httpRequest(url,'GET','',id);
  });
}

async function resolveSeriesId(url){
  url=url.trim();
  const m=url.match(/https?:\/\/[^\s，。）)]+/);
  if(m)url=m[0];
  const m2=url.match(/https?:\/\/novelquickapp\.com\/s\/([a-zA-Z0-9]+)/);
  if(m2){
    try{
      const r=await nativeGet(url);
      const m3=r.match(/(\d{15,})/);
      if(m3)return m3[1];
    }catch(e){}
    throw new Error('无法解析链接，请直接输入数字ID');
  }
  if(/^\d{15,}$/.test(url))return url;
  throw new Error('无法识别链接');
}

async function parseDrama(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){AndroidBridge.toast('请输入链接');return}
  AndroidBridge.toast('解析中...');
  try{
    const sid=await resolveSeriesId(url);
    const r=await nativePost('/novel/player/multi_video_detail/preload/v1',{series_id:sid,aid:1967,device_platform:0});
    const j=await r.json();
    if(!j.data||!j.data.album)throw new Error('解析失败');
    const a=j.data.album;
    episodes=(a.video_list||[]).map((v,i)=>({vid_index:i+1,vid:String(v.video_id||v.item_id)}));
    currentSeriesId=sid;
    selectedEps=new Set(episodes.map(e=>e.vid_index));
    document.getElementById('dramaTitle').textContent=a.title||'未知';
    document.getElementById('dramaMeta').textContent=`共${episodes.length}集`;
    if(a.cover_url){document.getElementById('cover').src=a.cover_url;document.getElementById('cover').style.display=''}
    renderEpGrid();
    document.getElementById('infoCard').classList.remove('hidden');
    AndroidBridge.toast('解析成功');
  }catch(e){AndroidBridge.toast('解析失败: '+e.message)}
}

function renderEpGrid(){
  const g=document.getElementById('epGrid');g.innerHTML='';
  episodes.forEach(ep=>{
    const d=document.createElement('div');
    d.className='ep'+(selectedEps.has(ep.vid_index)?' sel':'');
    d.textContent=ep.vid_index;
    d.onclick=()=>{selectedEps.has(ep.vid_index)?selectedEps.delete(ep.vid_index):selectedEps.add(ep.vid_index);renderEpGrid()};
    g.appendChild(d);
  });
}
function selectAll(s){selectedEps=s?new Set(episodes.map(e=>e.vid_index)):new Set();renderEpGrid()}
function selectRange(a,b){const n=episodes.length,s=a>0?a-1:n+a,e=b>0?b:n+b;for(let i=s;i<=e;i++)selectedEps.add(i+1);renderEpGrid()}

function pickTarget(t){
  downloadTarget=t;
  document.getElementById('pickLocal').classList.toggle('picked',t==='local');
  document.getElementById('pickCloud').classList.toggle('picked',t==='cloud');
}
pickTarget('local');

async function startDownload(){
  if(!currentSeriesId){AndroidBridge.toast('请先解析');return}
  const eps=[...selectedEps];if(!eps.length){AndroidBridge.toast('请选择集数');return}
  if(downloadTarget==='cloud'&&!cloudHost){AndroidBridge.toast('请先在设置配置NAS');return}
  document.getElementById('progressCard').classList.remove('hidden');
  document.getElementById('errorList').innerHTML='';

  if(downloadTarget==='cloud'){
    try{
      const id='cb'+(++httpCallbackId);
      httpCallbacks[id]={resolve:()=>{},reject:()=>{}};
      AndroidBridge.httpRequest(`http://${cloudHost}:${cloudPort}/api/download`,'POST',JSON.stringify({series_id:currentSeriesId,episodes:eps}),id);
      AndroidBridge.toast('已提交到NAS');
      document.getElementById('progressText').textContent='已提交到NAS处理';
    }catch(e){AndroidBridge.toast('云端请求失败: '+e.message)}
    return;
  }

  const dramaDir=downloadDir+'/'+currentSeriesId;
  AndroidBridge.runCommand('mkdir -p '+dramaDir,'mkdir');
  let done=0,failed=[];
  for(const idx of eps){
    document.getElementById('progressText').textContent=`下载中 ${done+1}/${eps.length} (第${idx}集)`;
    document.getElementById('progressFill').style.width=Math.round(done/eps.length*100)+'%';
    try{
      const ep=episodes.find(e=>e.vid_index===idx);
      const r=await nativePost('/novel/player/multi_video_model/preload/v1',{mixed_video_id_map:{'1004':[ep.vid]},aid:1967});
      const j=await r.json();
      const vi=j.data.video_infos['1004'][0];
      const url=vi.play_url||vi.video_url;
      const outPath=dramaDir+'/'+String(idx).padStart(3,'0')+'_第'+idx+'集.mp4';
      AndroidBridge.downloadFile(url,outPath);
      await new Promise(r=>setTimeout(r,1000));
    }catch(e){failed.push(idx)}
    done++;
  }
  document.getElementById('progressText').textContent=failed.length?`完成，${failed.length}个失败`:'全部完成';
  document.getElementById('progressFill').style.width='100%';
  if(failed.length)document.getElementById('errorList').innerHTML=failed.map(e=>'<div class="error-box">❌ 第'+e+'集</div>').join('');
}

function showSettings(){document.getElementById('settingsPanel').classList.add('show')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('show')}

function onSettingsLoaded(host,port,pwd){
  cloudHost=host||'';cloudPort=port||'8800';cloudPwd=pwd||'';
  document.getElementById('setHost').value=cloudHost;
  document.getElementById('setPort').value=cloudPort;
  document.getElementById('setPwd').value=cloudPwd;
}

function saveSettings(){
  AndroidBridge.saveSettings(
    document.getElementById('setHost').value.trim(),
    document.getElementById('setPort').value.trim(),
    document.getElementById('setPwd').value
  );
  closeSettings();
}

function onSharedText(text){
  const m=text.match(/https?:\/\/[^\s，。）)]+/);
  if(m){
    document.getElementById('urlInput').value=m[0];
    parseDrama();
  }else{
    AndroidBridge.toast('未找到链接');
  }
}

if(window.AndroidBridge)downloadDir=AndroidBridge.getDownloadDir();
</script>
</body>
</html>
