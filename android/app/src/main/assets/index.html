<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>红果下载器</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--input:#16213e;--accent:#e94560;--blue:#0f3460;--green:#2ecc71;--orange:#ff9f43;--red:#ff6b6b;--text:#e0e0e0;--dim:#888;--border:#2a2a4a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
.topbar{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.topbar h1{font-size:16px;color:var(--accent);flex:1}
.settings-btn{background:none;border:none;font-size:20px;padding:4px 8px}
.container{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px}
input,button{padding:11px 14px;border:none;border-radius:8px;font-size:14px;outline:none}
input{background:var(--input);color:#fff;flex:1;min-width:0}
button{background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
button:active{opacity:.8}
button.sec{background:var(--blue)}
button.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.row{display:flex;gap:8px;margin-bottom:10px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px;margin-top:10px}
.ep{background:var(--input);padding:9px 4px;text-align:center;border-radius:7px;cursor:pointer;border:2px solid transparent;font-size:12px}
.ep.sel{border-color:var(--accent);background:rgba(233,69,96,.15)}
.hidden{display:none!important}
.cover-lg{width:90px;border-radius:8px;aspect-ratio:3/4;object-fit:cover;flex-shrink:0;background:var(--input)}
.info-row{display:flex;gap:12px;margin-bottom:12px}
.mode-pick{display:flex;gap:8px;margin:10px 0}
.mode-pick button{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--input);color:var(--text);font-size:13px}
.mode-pick button.picked{border-color:var(--accent);background:rgba(233,69,96,.15);color:var(--accent)}
.error-box{color:var(--red);padding:5px 8px;background:rgba(192,57,43,.1);border-radius:6px;margin:4px 0;font-size:11px;word-break:break-all;overflow-wrap:break-word}
.progress-bar{background:var(--input);border-radius:4px;height:6px;margin-top:6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--accent),#ff6b9d);height:100%;transition:width .3s}
.settings-panel{position:fixed;inset:0;background:rgba(15,15,26,.97);z-index:200;display:none;align-items:center;justify-content:center}
.settings-panel.show{display:flex}
.settings-box{background:var(--card);padding:24px;border-radius:14px;width:min(340px,90vw)}
.settings-box h2{color:var(--accent);margin-bottom:16px;font-size:18px}
.settings-box input{width:100%;margin-bottom:8px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎬 红果下载器</h1>
  <button class="settings-btn" onclick="showSettings()">⚙️</button>
</div>

<div class="container">
  <div class="card">
    <div class="row">
      <input id="urlInput" placeholder="粘贴分享链接">
      <button onclick="parseDrama()">解析</button>
    </div>
  </div>

  <div id="infoCard" class="card hidden">
    <div class="info-row">
      <img id="cover" class="cover-lg" src="" onerror="this.style.display='none'">
      <div>
        <div id="dramaTitle" style="font-size:17px;font-weight:700"></div>
        <div id="dramaMeta" style="color:var(--dim);font-size:12px;margin-top:4px"></div>
      </div>
    </div>
    <div class="row">
      <button class="sec sm" onclick="selectAll(true)">全选</button>
      <button class="sec sm" onclick="selectAll(false)">取消</button>
    </div>
    <div class="ep-grid" id="epGrid"></div>
    <div class="mode-pick">
      <button id="pickLocal" onclick="pickTarget('local')">📱 下载到本地</button>
      <button id="pickCloud" onclick="pickTarget('cloud')">☁️ 下载到NAS</button>
    </div>
    <button style="width:100%;padding:13px;font-size:15px;border-radius:8px;margin-top:12px" onclick="startDownload()">⬇️ 开始下载</button>
  </div>

  <div id="progressCard" class="card hidden">
    <div class="card-title">📊 下载进度</div>
    <div id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div id="errorList"></div>
  </div>

  <div id="downloadedCard" class="card">
    <div class="card-title">📁 已下载</div>
    <div id="downloadedList"></div>
  </div>
</div>

<button id="debugBtn" onclick="toggleDebug()" style="position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:#e94560;color:#fff;border:none;font-size:20px;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.3)">🐛</button>
<div id="debugPanel" style="display:none;position:fixed;bottom:80px;right:10px;left:10px;height:50vh;background:#1a1a2e;border:1px solid #e94560;border-radius:12px;z-index:998;overflow-y:auto;padding:10px;font-family:monospace;font-size:11px;color:#0f0">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b style="color:#e94560">调试日志</b>
    <div>
      <button onclick="navigator.clipboard.writeText(document.getElementById('debugLog').innerText).then(()=>alert('已复制'))" style="background:#333;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:11px;margin-right:4px">复制</button>
      <button onclick="document.getElementById('debugLog').innerHTML=''" style="background:#333;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:11px;margin-right:6px">清空</button>
    <button onclick="navigator.clipboard.writeText(document.getElementById('debugLog').innerText).then(()=>AndroidBridge.toast('日志已复制')).catch(()=>{})" style="background:#e94560;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:11px">复制</button>
    </div>
  </div>
  <div id="debugLog"></div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-box">
    <h2>⚙️ NAS 连接（聚酷）</h2>
    <input id="setHost" placeholder="NAS 地址 (如 http://192.168.31.76:8998)">
    <input id="setUser" placeholder="账号（聚酷账号，可选）">
    <input id="setPwd" type="password" placeholder="密码">
    <div class="row">
      <button class="sec" style="flex:1" onclick="testConnection()">测试连接</button>
      <button style="flex:1" onclick="saveSettings()">保存</button>
      <button class="sec" style="flex:1" onclick="closeSettings()">关闭</button>
    </div>
  </div>
</div>

<script>
const API='https://api5-normal-sinfonlineb.fqnovel.com';
let episodes=[],currentSeriesId='',selectedEps=new Set(),downloadDir='/sdcard/Download/HG_Download';
let currentTitle='',currentCover='';
let cloudHost='',cloudUser='',cloudPwd='',downloadTarget='local';
let httpCallbackId=0,httpCallbacks={};
let fileDlId=0,fileCallbacks={};
let webMediaCallbacks={};
let cloudPollTimer=null;

function dbg(msg){
  const el=document.getElementById('debugLog');
  if(el){
    const t=new Date().toLocaleTimeString();
    el.innerHTML+=`[${t}] ${msg}<br>`;
    el.scrollTop=el.scrollHeight;
  }
  console.log(msg);
}
function toggleDebug(){
  const p=document.getElementById('debugPanel');
  p.style.display=p.style.display==='none'?'block':'none';
}

function hgApiCall(path,body){
  dbg('API: '+path+' body='+JSON.stringify(body).slice(0,100));
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve:(r)=>{dbg('API resp: '+path+' -> '+(r.text||'').slice(0,100));resolve(r)},reject:(e)=>{dbg('API err: '+path+' -> '+e);reject(e)}};
    AndroidBridge.hgApiCall(path,JSON.stringify(body),id);
  });
}

function httpGet(url){
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve,reject};
    AndroidBridge.httpRequest(url,'GET','',id);
  });
}
function httpPost(url,body){
  return new Promise((resolve,reject)=>{
    const id='cb'+(++httpCallbackId);
    httpCallbacks[id]={resolve,reject};
    AndroidBridge.httpRequest(url,'POST',JSON.stringify(body),id);
  });
}

function fetchWebMedia(seriesId,vid){
  return new Promise((resolve,reject)=>{
    const id='wm'+(++httpCallbackId);
    webMediaCallbacks[id]={resolve,reject};
    AndroidBridge.fetchWebMedia(seriesId,vid,id);
  });
}
window.onWebMedia=(id,url)=>{
  if(webMediaCallbacks[id]){webMediaCallbacks[id].resolve(url);delete webMediaCallbacks[id]}
};

window.onHttpResponse=(id,code,finalUrl,body)=>{
  if(httpCallbacks[id]){
    httpCallbacks[id].resolve({status:code,url:finalUrl,text:body,json:()=>Promise.resolve(JSON.parse(body))});
    delete httpCallbacks[id];
  }
};
window.onHttpError=(id,msg)=>{
  if(webMediaCallbacks[id]){webMediaCallbacks[id].reject(new Error(msg));delete webMediaCallbacks[id]}
  if(httpCallbacks[id]){httpCallbacks[id].reject(new Error(msg));delete httpCallbacks[id]}
};
window.onFileDownloaded=(path)=>{
  for(const fid in fileCallbacks){if(fileCallbacks[fid].path===path){fileCallbacks[fid].res();delete fileCallbacks[fid]}}
};
window.onFileError=(cid,msg)=>{
  if(fileCallbacks[cid]){fileCallbacks[cid].rej(new Error(msg));delete fileCallbacks[cid]}
};

async function resolveSeriesId(url){
  url=url.trim();
  dbg('resolveSeriesId input: '+url.slice(0,100));
  if(/^\d+$/.test(url))return url;
  const m=url.match(/https?:\/\/[^\s<>"'，。]+/);
  if(m)url=m[0].replace(/[.,;:!?，。；：！？]+$/,'');
  dbg('extracted url: '+url);
  const r=await httpGet(url);
  dbg('httpGet finalUrl: '+r.url);
  dbg('httpGet body: '+(r.text||'').slice(0,200));
  const finalUrl=r.url;
  let m2=finalUrl.match(/video_series_id=(\d+)/);
  if(m2)return m2[1];
  m2=finalUrl.match(/schemeParams[^&]*/);
  if(m2){
    try{
      const raw=decodeURIComponent(decodeURIComponent(m2[0]));
      const jm=raw.match(/"video_id"\s*:\s*"(\d+)"/);
      if(jm)return jm[1];
    }catch(e){}
  }
  const body=r.text||'';
  m2=body.match(/video_series_id=(\d+)/)||body.match(/"video_id"\s*:\s*"(\d+)"/)||body.match(/"series_id"\s*:\s*"(\d+)"/);
  if(m2)return m2[1];
  throw new Error('无法解析链接');
}

async function parseDrama(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){AndroidBridge.toast('请输入链接');return}
  AndroidBridge.toast('解析中...');
  try{
    const sid=await resolveSeriesId(url);
    dbg('sid='+sid);
    const r=await hgApiCall('/novel/player/video_detail/v1/',{series_id:sid});
    dbg('detail resp: '+(r.text||'').slice(0,200));
    const j=await r.json();
    if(j.code!==0&&j.Code!==0&&j.code!==undefined)throw new Error(j.message||j.Message||'API错误');
    const d=j.data||{};
    const vd=d.video_data||{};
    const vl=vd.video_list||[];
    episodes=vl.map((v,i)=>({vid_index:parseInt(v.vid_index)||i+1,vid:String(v.vid)}));
    currentSeriesId=sid;
    selectedEps=new Set(episodes.map(e=>e.vid_index));
    currentTitle=vd.series_title||vd.title||vd.book_name||'未命名';
    currentCover=vd.series_cover||vd.cover_url||vd.book_pic||'';
    document.getElementById('dramaTitle').textContent=currentTitle;
    document.getElementById('dramaMeta').textContent=`共${episodes.length}集`;
    if(currentCover){document.getElementById('cover').src=currentCover;document.getElementById('cover').style.display=''}
    renderEpGrid();
    document.getElementById('infoCard').classList.remove('hidden');
    AndroidBridge.toast('解析成功');
  }catch(e){AndroidBridge.toast('解析失败: '+e.message)}
}

let dragStart=null,dragSelectMode=true,dragTimer=null,dragActive=false,touchStartX=0,touchStartY=0;
function renderEpGrid(){
  const g=document.getElementById('epGrid');g.innerHTML='';
  episodes.forEach(ep=>{
    const d=document.createElement('div');
    d.className='ep'+(selectedEps.has(ep.vid_index)?' sel':'');
    d.textContent=ep.vid_index;
    d.dataset.ep=ep.vid_index;
    d.addEventListener('touchstart',e=>{
      dragActive=false;
      dragStart=ep.vid_index;
      dragSelectMode=!selectedEps.has(ep.vid_index);
      touchStartX=e.touches[0].clientX;
      touchStartY=e.touches[0].clientY;
      dragTimer=setTimeout(()=>{
        dragActive=true;
        toggleEp(ep.vid_index);
      },500);
    });
    d.addEventListener('touchmove',e=>{
      if(!dragActive){
        const dx=Math.abs(e.touches[0].clientX-touchStartX);
        const dy=Math.abs(e.touches[0].clientY-touchStartY);
        if(dx>10||dy>10){clearTimeout(dragTimer);dragStart=null}
        return;
      }
      e.preventDefault();
      const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
      if(t&&t.dataset.ep){
        const cur=parseInt(t.dataset.ep);
        const s=Math.min(dragStart,cur),en=Math.max(dragStart,cur);
        for(let i=s;i<=en;i++){
          if(dragSelectMode)selectedEps.add(i);else selectedEps.delete(i);
        }
        renderEpGrid();
      }
    },{passive:false});
    d.addEventListener('touchend',e=>{
      clearTimeout(dragTimer);
      if(!dragActive&&dragStart!=null){
        const dx=Math.abs(e.changedTouches[0].clientX-touchStartX);
        const dy=Math.abs(e.changedTouches[0].clientY-touchStartY);
        if(dx<10&&dy<10)toggleEp(dragStart);
      }
      dragStart=null;dragActive=false;
    });
    g.appendChild(d);
  });
}
function toggleEp(n){selectedEps.has(n)?selectedEps.delete(n):selectedEps.add(n);renderEpGrid()}
function selectAll(s){selectedEps=s?new Set(episodes.map(e=>e.vid_index)):new Set();renderEpGrid()}
function selectRange(a,b){const n=episodes.length,s=a>0?a-1:n+a,e=b>0?b:n+b;for(let i=s;i<=e;i++)selectedEps.add(i+1);renderEpGrid()}

function pickTarget(t){
  downloadTarget=t;
  document.getElementById('pickLocal').classList.toggle('picked',t==='local');
  document.getElementById('pickCloud').classList.toggle('picked',t==='cloud');
}
pickTarget('local');

// ===== 聚酷（juku）云模式 =====
async function jukuInit(){
  let r=await httpGet(cloudHost+'/api/ui/viewer');
  let j=JSON.parse(r.text);
  if(!j.ready){
    r=await httpGet(cloudHost+'/api/ui/viewer?confirm=1');
    j=JSON.parse(r.text);
  }
  if(!j.ready||!/^[a-f0-9]{64}$/.test(j.id))throw new Error('无法建立观看身份，请确认地址正确');
  AndroidBridge.setJukuIdentity(j.id,(j.sources||[]).join(','),String(j.onlineOnly===true));
  if(!j.account){
    if(!cloudUser){throw new Error('该NAS需要登录，请在设置填写账号');}
    const resp=await httpPost(cloudHost+'/api/ui/account/login',{username:cloudUser,password:cloudPwd});
    if(resp.status>=400){
      let e={};try{e=JSON.parse(resp.text)}catch(_){}
      if(e.code==='password_change_required')throw new Error('该账号需先在聚酷网页修改初始密码');
      throw new Error(e.error||('登录失败 HTTP '+resp.status));
    }
    r=await httpGet(cloudHost+'/api/ui/viewer');
    j=JSON.parse(r.text);
    if(!j.account)throw new Error('登录未生效');
  }
  return j;
}

function stopCloudPoll(){
  if(cloudPollTimer){clearInterval(cloudPollTimer);cloudPollTimer=null}
}
function startCloudPoll(dramaId){
  stopCloudPoll();
  const tick=async()=>{
    try{
      const r=await httpGet(cloudHost+'/api/ui/tasks');
      const j=JSON.parse(r.text);
      const tasks=(j.data||[]).filter(t=>t.dramaId===dramaId);
      const merge=(j.merges||{})[dramaId];
      const total=tasks.length||0;
      const done=tasks.filter(t=>t.status==='success').length;
      const running=tasks.filter(t=>['running','queued','parsing'].includes(t.status)).length;
      const failed=tasks.filter(t=>['failed','canceled'].includes(t.status)).length;
      const merging=!!(merge&&['queued','running'].includes(merge.status));
      let txt='';
      if(total)txt=`NAS 下载: ${done}/${total}集完成`+(running?` · ${running}个进行中`:'')+(failed?` · ${failed}个失败`:'');
      if(merging)txt+=` · 合并 ${merge.progress||0}%`;
      if(merge&&merge.status==='success'){txt+=' · 合并完成 ✅';stopCloudPoll();showDownloaded();}
      if(merge&&merge.status==='failed'){txt+=' · 合并失败';stopCloudPoll();}
      if(!merging&&total&&!running&&!failed){stopCloudPoll();txt+=' · 下载完成';showDownloaded();}
      document.getElementById('progressText').textContent=txt;
      document.getElementById('progressFill').style.width=total?Math.round(done/total*100)+'%':'50%';
    }catch(e){dbg('poll error: '+e.message)}
  };
  tick();
  cloudPollTimer=setInterval(tick,3000);
}

async function startDownload(){
  if(!currentSeriesId){AndroidBridge.toast('请先解析');return}
  const eps=[...selectedEps];if(!eps.length){AndroidBridge.toast('请选择集数');return}
  if(downloadTarget==='cloud'&&!cloudHost){AndroidBridge.toast('请先在设置配置NAS');return}
  document.getElementById('progressCard').classList.remove('hidden');
  document.getElementById('errorList').innerHTML='';

  if(downloadTarget==='cloud'){
    try{
      await jukuInit();
      const dramaId='hongguo:'+currentSeriesId;
      const resp=await httpPost(cloudHost+'/api/ui/download',{ids:[dramaId],quality:0});
      if(resp.status>=400){
        let e={};try{e=JSON.parse(resp.text)}catch(_){}
        throw new Error(e.error||('HTTP '+resp.status));
      }
      AndroidBridge.writeFile(downloadDir+'/'+currentSeriesId+'/.meta.json',JSON.stringify({source:'cloud',title:currentTitle,cover:currentCover,id:currentSeriesId}));
      AndroidBridge.toast('已提交到NAS');
      document.getElementById('progressText').textContent='已提交到NAS（'+dramaId+'），正在解析...';
      document.getElementById('progressFill').style.width='5%';
      startCloudPoll(dramaId);
    }catch(e){AndroidBridge.toast('云端请求失败: '+e.message)}
    return;
  }

  const safeTitle=(currentTitle||currentSeriesId).replace(/[\\\/:*?"<>|]/g,'_');
  const dramaDir=downloadDir+'/'+safeTitle;
  AndroidBridge.runCommand('mkdir -p '+dramaDir,'mkdir');
  AndroidBridge.writeFile(dramaDir+'/.meta.json',JSON.stringify({source:'local',title:currentTitle,cover:currentCover,id:currentSeriesId}));
  await downloadEps(eps,dramaDir);
}

async function downloadEps(eps,dramaDir){
  let done=0,failed=[];
  for(const idx of eps){
    document.getElementById('progressText').textContent=`获取播放地址 ${done+1}/${eps.length} (第${idx}集)`;
    document.getElementById('progressFill').style.width=Math.round(done/eps.length*100)+'%';
    try{
      const ep=episodes.find(e=>e.vid_index===idx);
      let best='',bestKey='',fromWeb=false;
      try{
        const wu=await fetchWebMedia(currentSeriesId,ep.vid);
        if(wu&&wu.startsWith('http')){best=wu;fromWeb=true}
      }catch(e){dbg('web media ep'+idx+' err: '+e.message)}
      if(!best){
        const r=await hgApiCall('/novel/player/video_model/v1/',{video_id:ep.vid,content_type:1,biz_param:{need_all_video_definition:true,video_platform:3}});
        const j=await r.json();
        if(j.code!==0&&j.Code!==0&&j.code!==undefined)throw new Error(j.message||j.Message||'API错误');
        const md=j.data||{};
        let vm=md.video_model;
        if(typeof vm==='string')vm=vm?JSON.parse(vm):{};
        const vl=(vm&&vm.video_list)||[];
        let bestScore=-1;
        for(const v of vl){
          const meta=v.video_meta||{};
          if(String(meta.codec_type||'').toLowerCase()==='bytevc2')continue;
          const dm=String(meta.definition||'').match(/(\d+)/);
          const p=dm?parseInt(dm[1]):0;
          const w=parseInt(meta.vwidth||0),h=parseInt(meta.vheight||0);
          const score=p*1000000+w*h;
          if(score>bestScore){bestScore=score;best=v.main_url;bestKey=(v.encrypt_info||{}).spade_a||'';}
        }
      }
      if(!best)throw new Error('无播放地址');
      const outPath=dramaDir+'/'+String(idx).padStart(3,'0')+'_第'+idx+'集.mp4';
      const dlLabel=bestKey&&!fromWeb?'下载+解密':'下载';
      document.getElementById('progressText').textContent=`${dlLabel} ${done+1}/${eps.length} (第${idx}集)`;
      await new Promise((res,rej)=>{
        const fid='fd'+(++fileDlId);
        fileCallbacks[fid]={res,rej,path:outPath};
        if(bestKey&&!fromWeb){
          AndroidBridge.downloadDecryptFile(best,bestKey,outPath+'|'+fid);
        }else{
          AndroidBridge.downloadFile(best,outPath+'|'+fid);
        }
        setTimeout(()=>{if(fileCallbacks[fid]){fileCallbacks[fid].res();delete fileCallbacks[fid]}},120000);
      });
    }catch(e){dbg('download ep '+idx+' error: '+e.message);failed.push({ep:idx,err:e.message})}
    done++;
  }
  document.getElementById('progressText').textContent=failed.length?`完成，${failed.length}个失败`:'全部完成';
  document.getElementById('progressFill').style.width='100%';
  if(failed.length){
    document.getElementById('errorList').innerHTML=failed.map(f=>{
      const short=f.err.length>60?f.err.slice(0,60)+'...':f.err;
      return `<div class="error-box">❌ 第${f.ep}集: ${short} <button class="sm" style="margin-left:8px;padding:2px 8px" onclick="retryEp(${f.ep})">重试</button></div>`;
    }).join('');
  }
}

function retryEp(idx){
  const failedEps=[];
  document.querySelectorAll('#errorList .error-box').forEach(box=>{
    const m=box.textContent.match(/第(\d+)集/);
    if(m)failedEps.push(parseInt(m[1]));
  });
  const eps=failedEps.length?failedEps:[idx];
  AndroidBridge.toast('重试'+eps.length+'个失败集数...');
  document.getElementById('errorList').innerHTML='';
  const safeTitle=(currentTitle||currentSeriesId).replace(/[\\\/:*?"<>|]/g,'_');
  const dramaDir=downloadDir+'/'+safeTitle;
  downloadEps(eps,dramaDir);
}

function showSettings(){document.getElementById('settingsPanel').classList.add('show')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('show')}

function onSettingsLoaded(host,port,pwd,user){
  cloudHost=host||'';cloudPwd=pwd||'';cloudUser=user||'';
  document.getElementById('setHost').value=cloudHost;
  document.getElementById('setUser').value=cloudUser;
  document.getElementById('setPwd').value=cloudPwd;
  showDownloaded();
}

async function testConnection(){
  const host=document.getElementById('setHost').value.trim().replace(/\/$/,'');
  const user=document.getElementById('setUser').value.trim();
  const pwd=document.getElementById('setPwd').value;
  if(!host){AndroidBridge.toast('请先填写地址');return}
  dbg('testConnection: '+host);
  AndroidBridge.toast('正在测试...');
  cloudHost=host;cloudUser=user;cloudPwd=pwd;
  try{
    const j=await jukuInit();
    AndroidBridge.toast(j.account?('连接成功，已登录 '+j.account.username):'连接成功（匿名）');
    AndroidBridge.saveSettings(cloudHost,cloudUser,cloudPwd);
    showDownloaded();
  }catch(e){
    dbg('testConnection err: '+e.message);
    AndroidBridge.toast('连接失败: '+e.message);
  }
}

function saveSettings(){
  cloudHost=document.getElementById('setHost').value.trim().replace(/\/$/,'');
  cloudUser=document.getElementById('setUser').value.trim();
  cloudPwd=document.getElementById('setPwd').value;
  AndroidBridge.saveSettings(cloudHost,cloudUser,cloudPwd);
  closeSettings();
}

function onSharedText(text){
  const m=text.match(/https?:\/\/[^\s<>"'，。）)]+/);
  if(m){
    document.getElementById('urlInput').value=m[0];
    parseDrama();
  }else{
    AndroidBridge.toast('未找到链接');
  }
}

if(window.AndroidBridge)downloadDir=AndroidBridge.getDownloadDir();

async function showDownloaded(){
  const card=document.getElementById('downloadedCard');
  card.classList.remove('hidden');
  const list=document.getElementById('downloadedList');
  try{
    const dirs=JSON.parse(AndroidBridge.listDir(downloadDir));
    const items=dirs.filter(d=>d.isDir).map(d=>{
      const files=JSON.parse(AndroidBridge.listDir(downloadDir+'/'+d.name));
      const mps=files.filter(f=>f.name.endsWith('.mp4') && !f.name.startsWith('_'));
      let source='local',title=d.name,cover='';
      const metaFile=files.find(f=>f.name==='.meta.json');
      if(metaFile){try{const m=JSON.parse(AndroidBridge.readFile(downloadDir+'/'+d.name+'/.meta.json'));source=m.source||'local';title=m.title||d.name;cover=m.cover||''}catch(e){}}
      return {id:d.name,count:mps.length,size:mps.reduce((s,f)=>s+f.size,0),source,title,cover};
    }).filter(x=>x.count>0);

    if(cloudHost){
      try{
        const r=await httpGet(cloudHost+'/api/ui/tasks');
        const j=JSON.parse(r.text);
        const groups={};
        (j.data||[]).forEach(t=>{
          const gid=t.dramaId||t.dramaTitle||'';
          if(!groups[gid])groups[gid]={title:t.dramaTitle||gid,tasks:[],merge:null};
          groups[gid].tasks.push(t);
        });
        Object.entries(j.merges||{}).forEach(([gid,m])=>{
          if(!groups[gid])groups[gid]={title:m.dramaTitle||gid,tasks:[],merge:m};
          groups[gid].merge=m;
        });
        Object.keys(groups).forEach(gid=>{
          const g=groups[gid];
          const total=g.tasks.length;
          const done=g.tasks.filter(t=>t.status==='success').length;
          const running=g.tasks.filter(t=>['running','queued','parsing'].includes(t.status)).length;
          const failed=g.tasks.filter(t=>['failed','canceled'].includes(t.status)).length;
          const m=g.merge;
          items.push({
            id:gid,count:total,done,size:g.tasks.reduce((s,t)=>s+(t.totalBytes||0),0),
            source:'cloud',title:(g.title||gid).replace(/^hongguo:/,''),cover:'',
            merged:!!(m&&m.status==='success'),merging:!!(m&&['queued','running'].includes(m.status)),
            mergeProgress:m?(m.progress||0):0,running,failed
          });
        });
      }catch(e){dbg('cloud tasks error: '+e.message)}
    }

    if(!items.length){list.innerHTML='<div style="color:var(--dim)">暂无下载</div>';return}
    list.innerHTML=items.map(it=>{
      const isCloud=it.source==='cloud';
      const badge=isCloud?'☁️ NAS':'📱 本地';
      const badgeBg=isCloud?'rgba(46,204,113,.2)':'rgba(52,152,219,.2)';
      const badgeColor=isCloud?'#2ecc71':'#3498db';
      let sub;
      if(isCloud)sub=`${it.done}/${it.count}集完成${it.running?` · ${it.running}个进行中`:''}${it.failed?` · ${it.failed}个失败`:''}`;
      else sub=`${it.count}集 · ${(it.size/1048576).toFixed(1)}MB`;
      let actions='';
      if(isCloud){
        if(it.merging)actions+=`<span style="font-size:12px;color:var(--orange)">🔄 合并中 ${it.mergeProgress}%</span>`;
        else if(it.merged)actions+=`<span style="font-size:12px;color:var(--green)">✅ 已合并</span>`;
        else if(it.done>0)actions+=`<button class="sm" style="background:var(--green)" onclick="mergeDrama('${it.id}','cloud')">🔗 合并</button>`;
        if(it.failed>0)actions+=`<button class="sm" style="background:var(--orange)" onclick="retryCloud('${it.id}')">↻ 重试失败</button>`;
        actions+=`<button class="sm" style="background:#e74c3c" onclick="cancelCloud('${it.id}')">⏹ 取消任务</button>`;
      }else{
        actions+=`<button class="sm" style="background:#e74c3c" onclick="deleteDrama('${it.id}','local')">🗑 删除</button>`;
      }
      return `
      <div style="background:var(--input);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;gap:10px">
        <img src="${it.cover}" style="width:50px;height:67px;border-radius:6px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="font-size:14px;font-weight:600;flex:1">${it.title}</div>
            <span style="font-size:11px;padding:2px 6px;border-radius:4px;background:${badgeBg};color:${badgeColor}">${badge}</span>
          </div>
          <div style="color:var(--dim);font-size:12px;margin-top:4px">${sub}</div>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${actions}</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){list.innerHTML='<div class="error-box">读取失败: '+e.message+'</div>'}
}

function retryCloud(id){
  if(!confirm('重新尝试失败的集数？'))return;
  AndroidBridge.toast('已提交重试');
  const rid='cb'+(++httpCallbackId);
  httpCallbacks[rid]={resolve:()=>{AndroidBridge.toast('重试已提交');setTimeout(showDownloaded,1500)},reject:()=>{AndroidBridge.toast('操作失败')}};
  AndroidBridge.httpRequest(cloudHost+'/api/ui/tasks/retry','POST',JSON.stringify({dramaIds:[id]}),rid);
}
function cancelCloud(id){
  if(!confirm('取消这部剧的下载任务？已完成文件保留。'))return;
  AndroidBridge.toast('已提交取消');
  const rid='cb'+(++httpCallbackId);
  httpCallbacks[rid]={resolve:()=>{AndroidBridge.toast('已提交取消');setTimeout(showDownloaded,1500)},reject:()=>{AndroidBridge.toast('操作失败')}};
  AndroidBridge.httpRequest(cloudHost+'/api/ui/tasks/cancel','POST',JSON.stringify({dramaIds:[id]}),rid);
}

function deleteDrama(id,source){
  if(!confirm('确认删除这部剧的所有文件？'))return;
  if(source==='cloud'){cancelCloud(id);return}
  AndroidBridge.deleteDrama(downloadDir+'/'+id);
  AndroidBridge.toast('已删除');
  showDownloaded();
}

window.onMergeDone=(cid,code,msg)=>{
  dbg('mergeDone: code='+code+' msg='+msg);
  if(code===0){AndroidBridge.toast('合并完成');showDownloaded()}
  else{AndroidBridge.toast('合并失败: '+msg.slice(0,100))}
};

window.onFfmpegDownloaded=(path)=>{AndroidBridge.toast('ffmpeg下载完成');};
window.onFfmpegError=(msg)=>{AndroidBridge.toast('ffmpeg下载失败: '+msg);};

function mergeDrama(id,source){
  if(!cloudHost){AndroidBridge.toast('请先配置NAS地址');return}
  if(!confirm('确认提交到NAS合并？'))return;
  AndroidBridge.toast('正在提交NAS合并...');
  const rid='cb'+(++httpCallbackId);
  httpCallbacks[rid]={resolve:(r)=>{
    let j={};try{j=JSON.parse(r.text)}catch(_){}
    const accepted=j.accepted!==undefined?j.accepted:1;
    AndroidBridge.toast('合并任务已提交（'+accepted+'部）');
    startCloudPoll(id);
  },reject:()=>{AndroidBridge.toast('提交合并失败')}};
  AndroidBridge.httpRequest(cloudHost+'/api/ui/merge','POST',JSON.stringify({dramaIds:[id],deleteEpisodes:false,async:true}),rid);
}
showDownloaded();
</script>
