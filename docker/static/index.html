<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>红果短剧下载器</title>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card-hover: #1f1f3a;
  --input: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b9d;
  --blue: #0f3460;
  --green: #2ecc71;
  --orange: #ff9f43;
  --red: #ff6b6b;
  --text: #e0e0e0;
  --text-dim: #888;
  --border: #2a2a4a;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}
.container { max-width: 860px; margin: 0 auto; padding: 16px; }

/* Header */
.app-header { text-align: center; padding: 24px 0 16px; }
.app-header h1 { font-size: 24px; color: var(--accent); font-weight: 800; letter-spacing: 1px; }
.app-header p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

/* Cards */
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Input & Buttons */
input, button {
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
input {
  background: var(--input);
  color: #fff;
  flex: 1;
  min-width: 0;
}
input::placeholder { color: #555; }
button {
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
button:active { transform: scale(0.97); }
button:hover { opacity: 0.88; }
button.secondary { background: var(--blue); }
button.danger { background: #c0392b; }
button.sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

/* Search row */
.search-row { display: flex; gap: 8px; }
.search-row input { border-radius: 10px; }

/* Info card (drama detail) */
.drama-header-info { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.drama-cover-lg { width: 90px; border-radius: 10px; flex-shrink: 0; aspect-ratio: 3/4; object-fit: cover; background: var(--input); }
.drama-detail { flex: 1; min-width: 0; }
.drama-detail h2 { font-size: 18px; font-weight: 700; line-height: 1.3; }
.drama-detail .meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

/* Button groups */
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }

/* Episode grid */
.ep-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
  gap: 6px;
  margin-top: 12px;
}
.ep {
  background: var(--input);
  padding: 10px 4px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
}
.ep:active { transform: scale(0.95); }
.ep.selected { border-color: var(--accent); background: rgba(233,69,96,0.15); color: var(--accent-light); }

/* Download button */
.dl-btn { width: 100%; padding: 14px; font-size: 15px; border-radius: 10px; margin-top: 14px; }

/* Tasks panel */
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.panel-header h3 { margin: 0; font-size: 15px; }
.panel-arrow { color: var(--text-dim); font-size: 13px; transition: transform 0.2s; }
.panel-arrow.open { transform: rotate(90deg); }

.task-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.task-item:last-child { border-bottom: none; }
.task-top { display: flex; justify-content: space-between; align-items: center; }
.task-name { font-weight: 600; font-size: 14px; }
.task-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.task-bar {
  background: var(--input);
  border-radius: 4px;
  height: 5px;
  margin-top: 8px;
  overflow: hidden;
}
.task-bar-fill {
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  height: 100%;
  transition: width 0.3s;
  border-radius: 4px;
}
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.badge.running { background: rgba(46,204,113,0.15); color: var(--green); }
.badge.done { background: rgba(46,204,113,0.15); color: var(--green); }
.badge.error { background: rgba(255,107,107,0.15); color: var(--red); }

.error-line {
  color: var(--red);
  padding: 5px 8px;
  background: rgba(192,57,43,0.1);
  border-radius: 6px;
  margin: 4px 0;
  font-size: 11px;
}

/* Downloaded list */
.drama-row {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.drama-row:last-child { border-bottom: none; }
.drama-thumb {
  width: 44px;
  height: 60px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--input);
}
.drama-body { flex: 1; min-width: 0; }
.drama-title { font-weight: 700; font-size: 14px; line-height: 1.3; }
.drama-sub { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.tag-ok { background: rgba(46,204,113,0.15); color: var(--green); }
.tag-warn { background: rgba(255,159,67,0.15); color: var(--orange); cursor: pointer; }
.tag-warn:hover { text-decoration: underline; }
.drama-btns { display: flex; gap: 6px; flex-shrink: 0; flex-direction: column; }

.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 5px;
  margin-top: 8px;
}
.file-chip {
  background: var(--input);
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
}
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip button { padding: 2px 6px; font-size: 10px; border-radius: 4px; }

.expand-box {
  margin: 6px 0;
  padding: 10px;
  background: var(--input);
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.8;
  max-height: 180px;
  overflow-y: auto;
}
.expand-box pre { white-space: pre-wrap; font-size: 11px; color: #aaa; margin: 0; }

/* Login */
#loginOverlay {
  position: fixed; inset: 0;
  background: rgba(15,15,26,0.97);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
}
.login-box {
  background: var(--card);
  padding: 36px 28px;
  border-radius: 16px;
  text-align: center;
  width: min(320px, 90vw);
}
.login-box h2 { color: var(--accent); margin-bottom: 20px; font-size: 20px; }
.login-box input { width: 100%; margin-bottom: 12px; }
.login-box button { width: 100%; padding: 13px; }
#loginError { color: var(--red); margin-top: 10px; font-size: 13px; }

.hidden { display: none !important; }

/* Desktop tweaks */
@media (min-width: 768px) {
  .container { padding: 24px; }
  .card { padding: 22px; }
  .ep-grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .drama-cover-lg { width: 120px; }
  .drama-detail h2 { font-size: 20px; }
}

/* Mobile tweaks */
@media (max-width: 480px) {
  .container { padding: 10px; }
  .card { padding: 14px; border-radius: 12px; }
  .app-header h1 { font-size: 20px; }
  .ep-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 5px; }
  .ep { padding: 8px 2px; font-size: 12px; }
  .file-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .drama-btns { flex-direction: row; }
}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>🔒 请输入密码</h2>
    <input type="password" id="loginPwd" placeholder="访问密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登录</button>
    <div id="loginError"></div>
  </div>
</div>

<div class="container">
<div class="app-header">
  <h1>🎬 红果短剧下载器</h1>
</div>

<div class="card">
  <div class="search-row">
    <input id="urlInput" placeholder="粘贴分享链接，如 https://novelquickapp.com/s/xxx">
    <button onclick="parseDrama()">解析</button>
  </div>
</div>

<div id="infoCard" class="card hidden">
  <div class="drama-header-info">
    <img id="cover" class="drama-cover-lg" src="" onerror="this.style.display='none'">
    <div class="drama-detail">
      <h2 id="dramaTitle"></h2>
      <div class="meta" id="dramaMeta"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="secondary sm" onclick="selectAll(true)">全选</button>
    <button class="secondary sm" onclick="selectAll(false)">取消全选</button>
    <button class="secondary sm" onclick="selectRange(1,10)">前10集</button>
    <button class="secondary sm" onclick="selectRange(-30,-1)">后30集</button>
  </div>
  <div class="ep-grid" id="epGrid"></div>
  <button class="dl-btn" onclick="startDownload()">⬇️ 开始下载选中集数</button>
</div>

<div id="progressCard" class="card hidden">
  <div class="panel-header" onclick="toggleTaskPanel()">
    <h3>📊 下载任务</h3>
    <span class="panel-arrow open" id="taskToggle">▶</span>
  </div>
  <div id="taskBody"></div>
</div>

<div class="card">
  <div class="card-title">📁 已下载</div>
  <div id="fileList"></div>
</div>
</div>

<script>
let episodes = [];
let currentSeriesId = '';
let selectedEps = new Set();
let pollTimer = null;
let authToken = localStorage.getItem('authToken') || '';
let mergePollTimers = {};
let dramaData = {};

async function apiFetch(url, options = {}) {
  options.headers = options.headers || {};
  options.headers['X-Auth-Token'] = authToken;
  const r = await fetch(url, options);
  if (r.status === 401) {
    document.getElementById('loginOverlay').style.display = 'flex';
    throw new Error('未授权');
  }
  return r;
}

async function checkConfig() {
  const r = await fetch('/api/config');
  const d = await r.json();
  if (!d.need_auth) {
    document.getElementById('loginOverlay').style.display = 'none';
    init();
  } else if (authToken) {
    try {
      await apiFetch('/api/files');
      document.getElementById('loginOverlay').style.display = 'none';
      init();
    } catch(e) {
      authToken = '';
      localStorage.removeItem('authToken');
    }
  }
}

async function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password: pwd})});
  const d = await r.json();
  if (d.code === 0) {
    authToken = pwd;
    localStorage.setItem('authToken', pwd);
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('loginError').textContent = '';
    init();
  } else {
    document.getElementById('loginError').textContent = d.msg || '密码错误';
  }
}

function init() { loadFiles(); loadTasks(); }

async function parseDrama() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  try {
    const r = await apiFetch('/api/parse', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
    const d = await r.json();
    if (d.code !== 0) { alert('解析失败: ' + d.msg); return; }
    const info = d.data;
    episodes = info.episodes;
    currentSeriesId = info.series_id;
    selectedEps = new Set(episodes.map(e => e.vid_index));
    document.getElementById('dramaTitle').textContent = info.series_title;
    document.getElementById('dramaMeta').textContent = `共 ${episodes.length} 集`;
    if (info.cover) {
      const c = document.getElementById('cover');
      c.src = info.cover;
      c.style.display = '';
    }
    renderEpGrid();
    document.getElementById('infoCard').classList.remove('hidden');
  } catch(e) { alert('错误: ' + e.message); }
}

function renderEpGrid() {
  const grid = document.getElementById('epGrid');
  grid.innerHTML = '';
  episodes.forEach(ep => {
    const div = document.createElement('div');
    div.className = 'ep' + (selectedEps.has(ep.vid_index) ? ' selected' : '');
    div.textContent = ep.vid_index;
    div.onclick = () => { if (selectedEps.has(ep.vid_index)) selectedEps.delete(ep.vid_index); else selectedEps.add(ep.vid_index); renderEpGrid(); };
    grid.appendChild(div);
  });
}

function selectAll(sel) { selectedEps = sel ? new Set(episodes.map(e => e.vid_index)) : new Set(); renderEpGrid(); }
function selectRange(a, b) {
  const n = episodes.length;
  const start = a > 0 ? a - 1 : n + a;
  const end = b > 0 ? b : n + b;
  for (let i = start; i <= end; i++) selectedEps.add(i + 1);
  renderEpGrid();
}

async function startDownload() {
  if (!currentSeriesId) { alert('请先解析剧集'); return; }
  const eps = Array.from(selectedEps);
  if (eps.length === 0) { alert('请先选择要下载的集数'); return; }
  const resp = await apiFetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({series_id: currentSeriesId, episodes: eps})});
  const j = await resp.json();
  if (j.code !== 0) { alert('下载启动失败: ' + j.msg); return; }
  document.getElementById('progressCard').classList.remove('hidden');
  startPoll();
}

function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadTasks, 2000);
}

async function loadTasks() {
  try {
    const r = await apiFetch('/api/tasks');
    const d = await r.json();
    if (d.code !== 0) return;
    const tasks = d.data;
    const card = document.getElementById('progressCard');
    const body = document.getElementById('taskBody');
    if (tasks.length === 0) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    body.innerHTML = tasks.map(t => {
      const pct = t.total > 0 ? Math.round(t.done / t.total * 100) : 0;
      const statusText = t.status === 'running' ? '下载中' : (t.status === 'done' ? '已完成' : '失败');
      const title = t.title || ('任务 ' + t.task_id);
      const errs = t.errors || [];
      const failedEps = errs.map(e => { const m = e.match(/第(\d+)集/); return m ? parseInt(m[1]) : null; }).filter(Boolean);
      const errHtml = errs.length
        ? `<div style="margin-top:6px">${errs.slice(0,5).map(e => '<div class="error-line">❌ ' + e + '</div>').join('')}${errs.length > 5 ? `<div style="color:#888;font-size:11px;margin-top:4px">还有 ${errs.length - 5} 个错误...</div>` : ''}${failedEps.length && t.status === 'error' ? `<button class="sm" style="margin-top:6px;background:var(--orange)" onclick="retryTask('${t.task_id}', '${t.series_id}', [${failedEps.join(',')}])">🔄 重试失败集数 (${failedEps.length})</button>` : ''}</div>`
        : '';
      return `<div class="task-item">
        <div class="task-top">
          <div>
            <div class="task-name">${title}</div>
            <div class="task-meta">${t.done}/${t.total} · ${t.current || ''}</div>
          </div>
          <span class="badge ${t.status}">${statusText}</span>
        </div>
        <div class="task-bar"><div class="task-bar-fill" style="width:${pct}%"></div></div>
        ${errHtml}
      </div>`;
    }).join('');
    if (tasks.some(t => t.status === 'done' || t.status === 'error')) loadFiles();
  } catch(e) {}
}

function toggleTaskPanel() {
  const body = document.getElementById('taskBody');
  const toggle = document.getElementById('taskToggle');
  const open = body.classList.toggle('hidden');
  toggle.classList.toggle('open', !open);
}

async function deleteDrama(name) {
  if (!confirm(`确定删除《${name}》全部文件？`)) return;
  await apiFetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama: name})});
  loadFiles();
}

async function deleteFile(drama, filename) {
  if (!confirm(`删除 ${filename}？`)) return;
  await apiFetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama, filename})});
  loadFiles();
}

async function mergeDrama(name) {
  const drama = dramaData[name];
  if (drama && drama.missing > 0) {
    const list = drama.missing_list || [];
    let ranges = [];
    if (list.length) {
      let s = list[0], p = list[0];
      for (let i = 1; i < list.length; i++) {
        if (list[i] === p + 1) p = list[i];
        else { ranges.push(s === p ? s + '' : s + '-' + p); s = p = list[i]; }
      }
      ranges.push(s === p ? s + '' : s + '-' + p);
    }
    if (!confirm(`《${name}》还有 ${drama.missing} 集未下载完成：\n${ranges.join('、')}\n\n仍要继续合并吗？（只会合并已下载的集数）`)) return;
  } else {
    if (!confirm(`合并《${name}》所有集数为一个视频？合并后会自动删除单集文件。`)) return;
  }
  const r = await apiFetch('/api/merge', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({drama: name})});
  const d = await r.json();
  if (d.code !== 0) { alert('合并失败: ' + d.msg); return; }
  const logEl = document.getElementById('mergelog_' + name);
  if (logEl) {
    logEl.classList.remove('hidden');
    logEl.innerHTML = '<div style="color:#888">正在合并...</div>';
  }
  pollMergeStatus(name);
}

function pollMergeStatus(name) {
  if (mergePollTimers[name]) clearInterval(mergePollTimers[name]);
  mergePollTimers[name] = setInterval(async () => {
    try {
      const r = await apiFetch('/api/merge_status/' + encodeURIComponent(name));
      const d = await r.json();
      if (d.code !== 0) return;
      const t = d.data;
      const logEl = document.getElementById('mergelog_' + name);
      if (!logEl) { clearInterval(mergePollTimers[name]); return; }
      if (t.status === 'none') { clearInterval(mergePollTimers[name]); return; }
      const logText = (t.logs || []).slice(-20).join('\n');
      const badge = t.status === 'running' ? '<span class="badge running">合并中...</span>' :
                    t.status === 'done' ? '<span class="badge done">✅ 合并完成</span>' :
                    '<span class="badge error">❌ 失败</span>';
      logEl.innerHTML = `<div style="margin-bottom:4px">${badge}</div><pre>${logText}</pre>`;
      if (t.status === 'done' || t.status === 'error') {
        clearInterval(mergePollTimers[name]);
        setTimeout(loadFiles, 1000);
      }
    } catch(e) {}
  }, 1500);
}

async function retryTask(taskId, seriesId, eps) {
  if (!seriesId) { alert('无法获取剧集ID'); return; }
  const r = await apiFetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({series_id: seriesId, episodes: eps})});
  const j = await r.json();
  if (j.code !== 0) { alert('重试失败: ' + j.msg); return; }
  // Clear old task
  await apiFetch('/api/tasks/' + taskId, {method: 'DELETE'});
  startPoll();
}

function toggleMissing(name) {
  const el = document.getElementById('missing_' + name);
  if (el.classList.contains('hidden')) {
    const list = window._missingData[name] || [];
    if (list.length > 0) {
      let ranges = [];
      let start = list[0], prev = list[0];
      for (let i = 1; i < list.length; i++) {
        if (list[i] === prev + 1) prev = list[i];
        else { ranges.push(start === prev ? start + '' : start + '-' + prev); start = prev = list[i]; }
      }
      ranges.push(start === prev ? start + '' : start + '-' + prev);
      el.innerHTML = `<div style="color:var(--orange);margin-bottom:4px">缺 ${list.length} 集：</div><div style="color:#ccc">${ranges.join('、')}</div>`;
    }
    el.classList.remove('hidden');
  } else el.classList.add('hidden');
}

async function loadFiles() {
  try {
    const r = await apiFetch('/api/files');
    const d = await r.json();
    const el = document.getElementById('fileList');
    if (d.data.length === 0) { el.innerHTML = '<div style="color:#555;text-align:center;padding:20px">暂无下载</div>'; return; }
    el.innerHTML = d.data.map(drama => {
      let tags = '';
      if (drama.merged) tags = '<span class="tag tag-ok">已合并</span>';
      else if (drama.missing > 0) tags = `<span class="tag tag-warn" onclick="toggleMissing('${drama.name}')">缺${drama.missing}集 ▾</span>`;
      else if (drama.total_episodes && drama.count >= drama.total_episodes) tags = '<span class="tag tag-ok">✓ 已下完</span>';
      const mergeBtn = drama.merged ? '' : `<button class="sm secondary" onclick="mergeDrama('${drama.name}')">合并</button>`;
      return `<div class="drama-row">
        ${drama.cover ? `<img class="drama-thumb" src="${drama.cover}" loading="lazy">` : ''}
        <div class="drama-body">
          <div class="drama-title">${drama.title || drama.name}</div>
          <div class="drama-sub">${drama.count}集 · ${drama.size_mb}MB${drama.total_episodes ? ` · 共${drama.total_episodes}集` : ''} ${tags}</div>
          <div id="missing_${drama.name}" class="hidden expand-box"></div>
          <div id="mergelog_${drama.name}" class="hidden expand-box"></div>
          <div class="file-grid">
            ${drama.files.map(f => `<div class="file-chip"><span title="${f}">${f}</span><button onclick="deleteFile('${drama.name}','${f}')">✕</button></div>`).join('')}
          </div>
        </div>
        <div class="drama-btns">
          ${mergeBtn}
          <button class="sm danger" onclick="deleteDrama('${drama.name}')">删除</button>
        </div>
      </div>`;
    }).join('');
    window._missingData = {};
    dramaData = {};
    d.data.forEach(item => {
      window._missingData[item.name] = item.missing_list || [];
      dramaData[item.name] = item;
    });
  } catch(e) {}
}

checkConfig();
</script>
</body>
</html>
